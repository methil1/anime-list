<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>アニメモ！</title>
<meta name="description" content="アニメ視聴記録カタログ。クール別に作品を一覧し、ワンクリックで視聴状態を記録。">
<meta name="theme-color" content="#0d0e12">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="アニメモ">
<style>
  :root {
    --bg: #0d0e12;
    --bg-elev: #15171e;
    --bg-card: #1a1d26;
    --border: #272b36;
    --border-strong: #3a3f4d;
    --text: #e8eaef;
    --text-dim: #9aa0ad;
    --text-faint: #5f6675;
    --accent: #7c5cff;
    --accent-soft: #a48bff;
    --accent-glow: rgba(124, 92, 255, 0.4);
    --done: #34d399;
    --watching: #fbbf24;
    --maybe: #38bdf8;
    --dropped: #f87171;
    --planning: #f472b6;
    --radius: 12px;
    --radius-sm: 8px;
    --font: "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(124, 92, 255, 0.12), transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 20px 100px; }

  /* アプリシェル: 左レール / 中央 / (右マージンは広告用に温存) */
  .shell {
    max-width: 1360px; margin: 0 auto; padding: 0 20px 100px;
    display: grid; grid-template-columns: 212px minmax(0, 1fr); gap: 30px; align-items: start;
  }
  .rail {
    position: sticky; top: 16px; align-self: start;
    max-height: calc(100vh - 32px); overflow-y: auto; overflow-x: hidden;
    padding: 16px 4px 16px 0; margin-top: 24px;
    display: flex; flex-direction: column; gap: 18px;
    scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent;
  }
  .rail::-webkit-scrollbar { width: 6px; }
  .rail::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .rail .search { width: 100%; min-width: 0; flex: 0 0 auto; }
  .rail-views { display: flex; flex-direction: column; gap: 6px; }
  .rail-views .ytab { width: 100%; text-align: left; }
  .rail-group { display: flex; flex-direction: column; gap: 9px; }
  .rail-label { color: var(--text-faint); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  /* レール内の年ナビ: 年代折りたたみ */
  .rail .yearbar { display: flex; flex-direction: column; gap: 4px; overflow: visible; margin-top: 0; padding-bottom: 0; }
  .rail-dec-head {
    width: 100%; display: flex; align-items: center; gap: 7px; text-align: left;
    background: none; border: 0; color: var(--text-dim); cursor: pointer; font-family: inherit;
    font-size: 0.82rem; font-weight: 700; padding: 5px 4px; border-radius: 6px; transition: color .12s, background .12s;
  }
  .rail-dec-head:hover { color: var(--text); background: var(--bg-elev); }
  .rail-dec-tog { color: var(--text-faint); font-size: 0.7rem; width: 0.9em; flex: 0 0 auto; }
  .rail-dec-years { display: flex; flex-wrap: wrap; gap: 5px; padding: 2px 0 6px 16px; }
  .rail-dec-years .ytab { padding: 6px 10px; font-size: 0.82rem; }
  .rail-dec.folded .rail-dec-years { display: none; }
  .main { min-width: 0; }
  .main header { padding-top: 24px; }

  @media (max-width: 900px) {
    .shell { display: block; max-width: 1280px; }
    .rail {
      position: static; max-height: none; overflow: visible; margin-top: 16px; padding: 0;
      flex-direction: row; flex-wrap: wrap; gap: 12px 18px; align-items: flex-start;
    }
    .rail .search { flex: 1 1 240px; }
    .rail-views { flex-direction: row; flex-wrap: wrap; }
    .rail-views .ytab { width: auto; }
    .rail-group { flex: 1 1 100%; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px; }
    .rail-label { width: 100%; }
    .rail .yearbar { flex-direction: row; flex-wrap: wrap; }
    .rail-dec-years { padding-left: 0; }
    .main header { padding-top: 12px; }
  }

  /* Header */
  header { padding: 40px 0 18px; }
  .title-row { display: flex; align-items: stretch; justify-content: space-between; gap: 18px 28px; flex-wrap: wrap; }
  .title-block { flex: 0 1 360px; min-width: 240px; max-width: 460px; display: flex; flex-direction: column; }
  h1 { font-size: clamp(1.6rem, 1.1rem + 2vw, 2.5rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  h1 .accent { background: linear-gradient(120deg, var(--accent-soft), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .subtitle { color: var(--text-dim); margin-top: 6px; font-size: 0.92rem; }
  .dev-note { color: var(--accent); font-size: 0.82rem; margin-top: 5px; }
  .src-note { color: var(--text-faint); font-size: 0.76rem; margin-top: 4px; }

  .stats { display: flex; gap: 22px; margin-top: 18px; flex-wrap: wrap; }
  .stat { display: flex; flex-direction: column; }
  .stat .num { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .stat .lbl { color: var(--text-faint); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 14px; }
  .stat.done .num { color: var(--done); }
  .stat.watching .num { color: var(--watching); }
  .stat.maybe .num { color: var(--maybe); }
  .stat.dropped .num { color: var(--dropped); }
  .stat.planning .num { color: var(--planning); }
  .stat.eps .num { color: var(--accent-soft); }
  .stat.time .num { color: var(--accent-soft); font-size: 1.35rem; }
  .collection-bar { margin-top: 22px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  body.hide-scores .poster .score { display: none; }

  /* 右上コンテキストパネル（通常=今週の放送表 / コレクション=視聴の傾向） */
  .context-panel { flex: 1 1 520px; min-width: 300px; max-width: none; align-self: stretch;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; }
  .context-panel:empty { display: none; padding: 0; border: 0; }
  .cp-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    font-size: 0.82rem; font-weight: 700; color: var(--text-dim); margin-bottom: 9px; }
  .cp-tabs { display: flex; gap: 5px; }
  .cp-tab { background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-faint);
    padding: 3px 10px; border-radius: 999px; font-size: 0.74rem; cursor: pointer; font-family: inherit; transition: all .12s; }
  .cp-tab:hover { color: var(--text); border-color: var(--border-strong); }
  .cp-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* 週間放送表 */
  .sched { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; max-height: 420px; overflow-y: auto; }
  .sched::-webkit-scrollbar { width: 6px; }
  .sched::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
  .sched-day { min-width: 0; }
  .sched-day-h { font-size: 0.72rem; font-weight: 700; color: var(--text-faint); text-align: center;
    padding-bottom: 4px; border-bottom: 1px solid var(--border); margin-bottom: 5px; }
  .sched-item { display: flex; gap: 6px; align-items: baseline; padding: 2px 4px; border-radius: 6px; cursor: default; line-height: 1.3; }
  .sched-item:hover { background: var(--bg-elev); }
  .sched-item .t { flex: 0 0 auto; font-size: 0.62rem; font-weight: 700; color: var(--accent-soft); font-variant-numeric: tabular-nums; }
  .sched-item .n { flex: 1 1 auto; min-width: 0; font-size: 0.66rem; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sched-empty { color: var(--text-faint); font-size: 0.72rem; text-align: center; }
  /* 円グラフ＋凡例 */
  .cp-pie-wrap { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .cp-pie-box { flex: 0 0 auto; }
  .cp-pie { width: 116px; height: 116px; }
  .cp-pie-seg { transition: stroke-dasharray .65s cubic-bezier(.16, 1, .3, 1); }
  .cp-legend { display: flex; flex-direction: column; gap: 5px; flex: 1 1 130px; min-width: 130px; }
  .cp-leg { display: flex; align-items: center; gap: 7px; font-size: 0.76rem; }
  .cp-leg-dot { width: 9px; height: 9px; border-radius: 2px; flex: 0 0 auto; }
  .cp-leg-k { flex: 1 1 auto; min-width: 0; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cp-leg-v { color: var(--text-faint); font-variant-numeric: tabular-nums; }
  @media (max-width: 820px) { .context-panel { display: none; } }

  /* 放送カレンダー（別ページオーバーレイ） */
  .cal-overlay { position: fixed; inset: 0; z-index: 58; background: rgba(8, 9, 12, .93);
    backdrop-filter: blur(3px); display: none; flex-direction: column; padding: 22px clamp(14px, 4vw, 48px) 30px; overflow-y: auto; }
  .cal-overlay.open { display: flex; }
  .cal-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .cal-head h2 { font-size: 1.15rem; font-weight: 800; letter-spacing: .02em; }
  .cal-month { font-size: 1.05rem; font-weight: 700; color: var(--accent-soft); font-variant-numeric: tabular-nums; min-width: 128px; text-align: center; }
  .cal-nav { background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim);
    width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 1.15rem; line-height: 1; font-family: inherit; transition: all .12s; }
  .cal-nav:hover { color: var(--text); border-color: var(--border-strong); }
  .cal-spacer { flex: 1 1 auto; }
  .cal-btn { background: var(--bg-elev); border: 1px solid var(--border-strong); color: var(--text-dim);
    padding: 7px 15px; border-radius: 999px; cursor: pointer; font-family: inherit; font-size: 0.85rem; transition: all .12s; }
  .cal-btn:hover { color: var(--text); border-color: var(--text-faint); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-dow { text-align: center; font-size: 0.74rem; font-weight: 700; color: var(--text-faint); padding-bottom: 2px; }
  .cal-dow.sun { color: var(--dropped); }
  .cal-dow.sat { color: var(--maybe); }
  .cal-cell { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
    min-height: 118px; max-height: 220px; padding: 6px 6px 4px; display: flex; flex-direction: column; }
  .cal-cell.blank { background: transparent; border: 0; min-height: 0; }
  .cal-cell.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .cal-date { font-size: 0.78rem; font-weight: 700; color: var(--text-dim); margin-bottom: 4px; flex: 0 0 auto; }
  .cal-date.sun { color: var(--dropped); }
  .cal-date.sat { color: var(--maybe); }
  .cal-cell.today .cal-date { color: var(--accent-soft); }
  .cal-items { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; min-height: 0; }
  .cal-items::-webkit-scrollbar { width: 5px; }
  .cal-items::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
  .cal-item { display: flex; gap: 5px; align-items: baseline; padding: 1px 3px; border-radius: 5px; cursor: default; line-height: 1.25; }
  .cal-item:hover { background: var(--bg-elev); }
  .cal-item .t { flex: 0 0 auto; font-size: 0.6rem; font-weight: 700; color: var(--accent-soft); font-variant-numeric: tabular-nums; }
  .cal-item .n { flex: 1 1 auto; min-width: 0; font-size: 0.64rem; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cal-empty { color: var(--text-faint); font-size: 0.92rem; text-align: center; padding: 44px 0; }
  @media (max-width: 700px) { .cal-cell { min-height: 80px; } .cal-grid { gap: 3px; } .cal-item .t { display: none; } }

  /* Toolbar */
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 26px; }
  .toolbar .tlabel { color: var(--text-faint); font-size: 0.78rem; }
  .search { flex: 1; min-width: 200px; position: relative; }
  .search input {
    width: 100%; background: var(--bg-elev); border: 1px solid var(--border); color: var(--text);
    padding: 11px 14px 11px 40px; border-radius: var(--radius-sm); font-size: 0.95rem; font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-faint); }

  .chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .chip {
    background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim);
    padding: 9px 13px; border-radius: 999px; font-size: 0.83rem; cursor: pointer; font-family: inherit;
    transition: all .15s; white-space: nowrap;
  }
  .chip:hover { border-color: var(--border-strong); color: var(--text); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 4px 14px -4px var(--accent-glow); }
  .chip.done.active { background: var(--done); border-color: var(--done); color: #06281c; box-shadow: 0 4px 14px -4px rgba(52,211,153,.4); }
  .chip.watching.active { background: var(--watching); border-color: var(--watching); color: #3a2c05; box-shadow: 0 4px 14px -4px rgba(251,191,36,.4); }
  .chip.maybe.active { background: var(--maybe); border-color: var(--maybe); color: #07263b; box-shadow: 0 4px 14px -4px rgba(56,189,248,.4); }
  .chip.dropped.active { background: var(--dropped); border-color: var(--dropped); color: #2a0a0a; box-shadow: 0 4px 14px -4px rgba(248,113,113,.4); }
  .chip.planning.active { background: var(--planning); border-color: var(--planning); color: #3a0a25; box-shadow: 0 4px 14px -4px rgba(244,114,182,.4); }

  /* Year nav */
  .yearbar {
    display: flex; gap: 6px; overflow-x: auto; margin-top: 22px; padding-bottom: 6px;
    scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent;
  }
  .yearbar::-webkit-scrollbar { height: 6px; }
  .yearbar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .ytab {
    background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim);
    padding: 8px 14px; border-radius: var(--radius-sm); font-size: 0.9rem; cursor: pointer; font-family: inherit;
    white-space: nowrap; font-variant-numeric: tabular-nums; transition: all .12s; font-weight: 600;
  }
  .ytab:hover { color: var(--text); border-color: var(--border-strong); }
  .ytab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .ytab.collection { color: var(--accent-soft); border-color: var(--border-strong); }
  .ytab.collection.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .yearbar-label { color: var(--text-faint); font-size: 0.78rem; margin: 40px 0 -10px; }

  /* 年代別折りたたみ（視聴コレクション） */
  .decade-block { margin-top: 56px; }
  .decade-block:first-child { margin-top: 24px; }
  .decade-head { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none;
    font-size: 2.5rem; font-weight: 900; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
    padding-bottom: 10px; border-bottom: 2px solid var(--accent); margin-bottom: 4px; color: var(--accent-soft); }
  .decade-head-toggle { font-size: 1.1rem; min-width: 1.2em; color: var(--text-faint); }
  .decade-block.collapsed .decade-block-content { display: none; }
  .decade-block.collapsed .decade-head { margin-bottom: 0; }
  .decade-block .year-block { margin-top: 30px; }
  /* 新着: 追加日を最上位グループにする見出しバナー（中を 年代→年→クール で階層表示） */
  .recent-date-block { margin-top: 52px; }
  .recent-date-block:first-child { margin-top: 8px; }
  .recent-date-block .decade-block { margin-top: 28px; }
  .recent-date-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px;
    font-size: 1.1rem; font-weight: 800; color: var(--accent-soft);
    background: rgba(124,92,255,.12); padding: 9px 16px; border-radius: 12px; border-left: 4px solid var(--accent); }
  .recent-date-head .count { color: var(--text-faint); font-size: 0.82rem; font-weight: 600; }
  .recent-date-head .line { flex: 1; }

  /* 年別折りたたみ */
  .year-head { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .year-head-toggle { font-size: 0.9rem; min-width: 1.2em; }
  .year-block.collapsed .year-block-content { display: none; }

  /* Section headings */
  .year-block { margin-top: 40px; }
  .year-head { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .cour { margin-top: 26px; }
  .cour-head { display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--border); padding-bottom: 9px; margin-bottom: 16px; cursor: pointer; user-select: none; }
  .cour-head-toggle { font-size: 0.8rem; min-width: 1.1em; color: var(--text-faint); }
  .cour-head.s-recent { cursor: default; }
  .cour.collapsed .grid { display: none; }
  .cour.collapsed .cour-body { display: none; }
  .cour.collapsed .cour-head { margin-bottom: 0; }
  /* 自己評価ページの年代小見出し（年→クール無しの控えめ表示） */
  .rate-decade { margin-top: 16px; }
  .rate-decade.collapsed .grid { display: none; }
  .rate-decade.collapsed .rate-decade-head { margin-bottom: 0; }
  .rate-decade-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; font-size: 1rem; font-weight: 700; color: var(--text-dim); cursor: pointer; }
  .rate-decade-head .cour-head-toggle { flex: 0 0 auto; }
  .rate-decade-head .count { font-size: 0.78rem; font-weight: 600; color: var(--text-faint); }
  .cour-head .season { font-size: 1.15rem; font-weight: 700; }
  .cour-head .count { color: var(--text-faint); font-size: 0.82rem; }
  .cour-head .line { flex: 1; }
  .s-winter { color: #7dd3fc; }
  .s-spring { color: #f9a8d4; }
  .s-summer { color: #fcd34d; }
  .s-fall   { color: #fdba74; }
  .s-ova    { color: #5eead4; }
  .s-movie  { color: #c4b5fd; }
  .s-recent { color: var(--accent-soft); }

  /* Poster grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
  .poster {
    position: relative; cursor: pointer; border-radius: var(--radius); overflow: hidden;
    background: var(--bg-card); border: 2px solid var(--border);
    transition: transform .15s, border-color .15s, box-shadow .15s;
    user-select: none;
  }
  .poster:hover { transform: translateY(-3px); box-shadow: 0 12px 26px -12px rgba(0,0,0,.8); }
  .poster.done { border-color: var(--done); }
  .poster.watching { border-color: var(--watching); }
  .poster.maybe { border-color: var(--maybe); }
  .poster .img { aspect-ratio: 2/3; width: 100%; object-fit: cover; display: block; background: var(--bg-elev); }
  .poster .noimg { aspect-ratio: 2/3; display: grid; place-items: center; color: var(--text-faint); font-size: 0.8rem; padding: 10px; text-align: center; }

  .poster .meta {
    position: absolute; inset: auto 0 0 0; padding: 22px 9px 9px;
    background: linear-gradient(transparent, rgba(8,9,12,.95)55%);
  }
  .poster .ttl { font-size: 0.82rem; font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .poster .sub { font-size: 0.68rem; color: var(--text-dim); margin-top: 3px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .poster .ep { font-variant-numeric: tabular-nums; }
  .poster .multi { background: var(--accent); color: #fff; font-weight: 700; padding: 1px 6px; border-radius: 999px; font-size: 0.64rem; }
  .poster .cont { background: var(--watching); color: #3a2c05; font-weight: 700; padding: 1px 6px; border-radius: 999px; font-size: 0.64rem; }
  .poster .fmt { font-weight: 700; padding: 1px 6px; border-radius: 999px; font-size: 0.64rem; }
  .poster .fmt.short { background: #0e7490; color: #cffafe; }
  .poster .fmt.ova { background: #0f766e; color: #ccfbf1; }
  .poster .fmt.movie { background: #7c3aed; color: #fff; }

  /* status corner */
  .poster .status { position: absolute; top: 7px; right: 7px; width: 26px; height: 26px; border-radius: 50%; display: none; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .poster.done .status { display: grid; background: var(--done); color: #06281c; }
  .poster.watching .status { display: grid; background: var(--watching); color: #3a2c05; }
  .poster.maybe .status { display: grid; background: var(--maybe); color: #07263b; }
  .poster .status svg { width: 15px; height: 15px; }
  .poster .status .qmark { font-weight: 800; font-size: 15px; line-height: 1; }
  .poster.dropped { border-color: var(--dropped); }
  .poster.dropped .status { display: grid; background: var(--dropped); color: #2a0a0a; }
  .poster.planning { border-color: var(--planning); }
  .poster.planning .status { display: grid; background: var(--planning); color: #3a0a25; }
  .poster .status .xmark { font-weight: 800; font-size: 17px; line-height: 1; }
  .poster .prog { font-weight: 700; padding: 1px 6px; border-radius: 999px; font-size: 0.64rem; background: rgba(251,191,36,.22); color: var(--watching); }
  .poster .prog.dropped { background: rgba(248,113,113,.2); color: var(--dropped); }
  .poster .myrate { font-weight: 700; padding: 1px 6px; border-radius: 999px; font-size: 0.64rem; background: rgba(124,92,255,.25); color: var(--accent-soft); }
  .poster .score { position: absolute; top: 7px; left: 7px; background: rgba(8,9,12,.78); color: #fcd34d; font-size: 0.68rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
  .poster .score.noscore { color: var(--text-faint); }
  /* タッチ端末用 情報ボタン（ホバーできない端末でのみ表示） */
  .poster .pinfo { display: none; position: absolute; top: 40px; right: 7px; z-index: 3;
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border-strong);
    background: rgba(8,9,12,.82); color: var(--accent-soft); font-family: Georgia, "Times New Roman", serif;
    font-style: italic; font-weight: 700; font-size: 16px; line-height: 1; cursor: pointer;
    align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .poster .pinfo:active { background: var(--accent); color: #fff; }
  .info-card.pinned { pointer-events: auto; }
  @media (hover: none) and (pointer: coarse) { .poster .pinfo { display: flex; } }

  /* empty / loading */
  .notice { text-align: center; padding: 80px 20px; color: var(--text-faint); }
  .notice .big { font-size: 2.6rem; margin-bottom: 10px; }
  .notice code { background: var(--bg-elev); padding: 2px 8px; border-radius: 6px; color: var(--accent-soft); }

  .reco-banner { margin: 4px 0 18px; padding: 13px 16px; background: var(--bg-elev); border-left: 3px solid var(--accent-soft); border-radius: 8px; font-size: 0.9rem; color: var(--text-dim); }
  .reco-banner b { color: var(--text); }
  .reco-sum { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.84rem; }
  .reco-sum-axis .k { color: var(--text-faint); margin-right: 4px; font-size: 0.78rem; }
  .reco-toggle { margin-left: 10px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--bg-elev); color: var(--text-dim); font-size: 0.8rem; cursor: pointer; }
  .reco-toggle:hover, .reco-toggle.active { border-color: var(--accent-soft); color: var(--text); }
  .reco-sub { margin-top: 6px; font-size: 0.8rem; color: var(--text-faint); }
  .collection-sort { margin: 2px 0 18px; }
  .series-block { margin: 0 0 26px; }
  .series-head { font-size: 1.02rem; font-weight: 700; color: var(--text); margin: 0 0 10px; padding-left: 10px; border-left: 3px solid var(--accent-soft); }
  .series-count { font-size: 0.8rem; font-weight: 600; color: var(--text-faint); margin-left: 8px; }
  /* 視聴比較ビュー */
  .cmp-banner-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cmp-sum { margin-top: 8px; font-size: 0.84rem; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .cmp-key { font-weight: 600; padding: 1px 9px; border-radius: 999px; font-size: 0.78rem; }
  .cmp-key.both { background: rgba(64, 209, 153, .16); color: var(--done); }
  .cmp-key.mine { background: rgba(90, 169, 255, .16); color: #8cc4ff; }
  .cmp-key.theirs { background: rgba(255, 159, 67, .16); color: #ffbb78; }
  .cmp-banner .cp-tabs { margin-top: 11px; flex-wrap: wrap; }
  .poster .cmp-row { margin-top: 5px; display: flex; flex-direction: column; gap: 1px; font-size: 0.66rem; line-height: 1.3; }
  .poster .cmp-me { color: #cfe6ff; }
  .poster .cmp-them { color: #ffe0bd; }
  .poster .cmp-me.none, .poster .cmp-them.none { color: var(--text-faint); }
  .poster.cmp-both { border-color: var(--done); }
  .poster.cmp-mine { border-color: #5aa9ff; }
  .poster.cmp-theirs { border-color: #ff9f43; }
  .poster.cmp-both::after, .poster.cmp-mine::after, .poster.cmp-theirs::after { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; z-index: 2; }
  .poster.cmp-both::after { background: var(--done); }
  .poster.cmp-mine::after { background: #5aa9ff; }
  .poster.cmp-theirs::after { background: #ff9f43; }
  .ctx-menu .ctx-hide.on { color: var(--accent-soft); }
  .ctx-menu .ctx-item.on { color: var(--accent-soft); }

  .foot-note { margin-top: 30px; text-align: center; color: var(--text-faint); font-size: 0.8rem; }
  .foot-note a { color: var(--text-dim); cursor: pointer; text-decoration: underline; }
  .src-credit { margin-top: 18px; text-align: right; color: var(--text-faint); font-size: 0.72rem; }
  .src-credit a { color: var(--text-dim); text-decoration: none; }
  .src-credit a:hover { text-decoration: underline; }

  /* toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--bg-card); border: 1px solid var(--border-strong); color: var(--text); padding: 11px 18px; border-radius: 999px; font-size: 0.88rem; box-shadow: 0 12px 30px -10px rgba(0,0,0,.7); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; }
  /* 先頭へ戻るフローティングボタン（カレンダー(z-58)より下＝オーバーレイ表示中は隠す） */
  .to-top { position: fixed; bottom: 22px; right: 22px; z-index: 55; width: 46px; height: 46px; border-radius: 50%;
    background: var(--bg-card); border: 1px solid var(--border-strong); color: var(--text-dim); font-size: 1.25rem; line-height: 1;
    cursor: pointer; font-family: inherit; box-shadow: 0 10px 26px -10px rgba(0,0,0,.7);
    opacity: 0; pointer-events: none; transform: translateY(12px); transition: opacity .2s, transform .2s, color .12s, border-color .12s; }
  .to-top.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .to-top:hover { color: var(--accent-soft); border-color: var(--accent); }
  @media (max-width: 700px) { .to-top { bottom: 16px; right: 16px; width: 42px; height: 42px; } }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Context menu (右クリック) */
  .ctx-menu { position: fixed; z-index: 70; min-width: 190px; max-width: 290px; background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); box-shadow: 0 16px 40px -12px rgba(0,0,0,.8); padding: 6px; display: none; }
  .ctx-menu.show { display: block; }
  .ctx-menu .ctx-title { padding: 7px 10px 6px; font-size: 0.78rem; color: var(--text-faint); border-bottom: 1px solid var(--border); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctx-menu .ctx-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; font-size: 0.86rem; color: var(--text); cursor: pointer; user-select: none; }
  .ctx-menu .ctx-item:hover { background: var(--bg-elev); color: var(--accent-soft); }
  .ctx-menu .ctx-stars { display: flex; gap: 3px; padding: 7px 10px 8px; }
  .ctx-menu .ctx-star { cursor: pointer; font-size: 1.2rem; line-height: 1; color: var(--text-faint); transition: color .1s; }
  .ctx-menu .ctx-star.on { color: #fcd34d; }
  .ctx-menu .ctx-star:hover { color: #fde68a; }
  .ctx-menu .ctx-seclabel { padding: 4px 10px 3px; font-size: 0.72rem; color: var(--text-faint); }
  .ctx-menu .ctx-states { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 8px 4px; }
  .ctx-menu .ctx-state { padding: 5px 9px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; border: 1px solid var(--border); color: var(--text-dim); user-select: none; white-space: nowrap; }
  .ctx-menu .ctx-state:hover { border-color: var(--border-strong); color: var(--text); }
  .ctx-menu .ctx-state.cur { border-color: var(--accent); color: #fff; background: var(--accent); }
  .ctx-menu .ctx-ep { display: flex; align-items: center; gap: 6px; padding: 3px 10px 8px; font-size: 0.78rem; color: var(--text-dim); }
  .ctx-menu .ctx-ep input { width: 60px; background: var(--bg-elev); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 6px; font-family: inherit; font-size: 0.82rem; }
  .ctx-menu .ctx-divider { height: 1px; background: var(--border); margin: 5px 4px; }
  /* 話数記録モーダル（エピソード単位） */
  .ep-overlay { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.6); display: none; }
  .ep-overlay.show { display: block; }
  .ep-modal { position: fixed; z-index: 81; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: min(440px, calc(100vw - 32px)); max-height: min(80vh, 640px); overflow: auto;
    background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    box-shadow: 0 24px 60px -16px rgba(0,0,0,.85); padding: 16px 18px 18px; display: none; }
  .ep-modal.show { display: block; }
  .ep-modal .ep-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
  .ep-modal .ep-ttl { font-size: 0.98rem; font-weight: 700; color: var(--text); line-height: 1.3; flex: 1; }
  .ep-modal .ep-close { flex: 0 0 auto; background: none; border: none; color: var(--text-faint); font-size: 1.4rem; line-height: 1; cursor: pointer; padding: 0 2px; }
  .ep-modal .ep-close:hover { color: var(--text); }
  .ep-modal .ep-prog { font-size: 0.84rem; color: var(--text-dim); margin-bottom: 12px; }
  .ep-modal .ep-prog b { color: var(--accent-soft); font-variant-numeric: tabular-nums; }
  .ep-modal .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; margin-bottom: 12px; }
  .ep-modal .ep-chip { background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 7px; padding: 7px 0; font-family: inherit; font-size: 0.82rem; cursor: pointer; font-variant-numeric: tabular-nums; transition: background .1s, border-color .1s; }
  .ep-modal .ep-chip:hover { border-color: var(--border-strong); color: var(--text); }
  .ep-modal .ep-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ep-modal .ep-hint { font-size: 0.72rem; color: var(--text-faint); margin: -6px 0 12px; }
  .ep-modal .ep-upto { display: flex; align-items: center; gap: 7px; font-size: 0.82rem; color: var(--text-dim); margin-bottom: 12px; }
  .ep-modal .ep-upto input { width: 64px; background: var(--bg-elev); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 7px; font-family: inherit; font-size: 0.85rem; }
  .ep-modal .ep-actions { display: flex; gap: 8px; }
  .ep-modal .ep-btn { background: var(--accent); border: 1px solid var(--accent); color: #fff; border-radius: 7px; padding: 7px 14px; font-family: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
  .ep-modal .ep-btn:hover { background: var(--accent-soft); border-color: var(--accent-soft); }
  .ep-modal .ep-btn.ghost { background: transparent; color: var(--text-faint); border-color: var(--border); font-weight: 500; }
  .ep-modal .ep-btn.ghost:hover { color: var(--text); border-color: var(--border-strong); background: var(--bg-elev); }
  /* 感想（テキスト記録） */
  #noteoverlay { z-index: 90; }
  .ep-modal.note-modal { z-index: 91; }
  .ep-modal .ep-seclabel { font-size: 0.76rem; color: var(--text-faint); font-weight: 700; letter-spacing: 0.04em; margin: 4px 0 6px; }
  .ep-modal .ep-note { width: 100%; min-height: 120px; resize: vertical; box-sizing: border-box;
    background: var(--bg-elev); border: 1px solid var(--border); color: var(--text); border-radius: 8px;
    padding: 9px 11px; font-family: inherit; font-size: 0.88rem; line-height: 1.55; margin-bottom: 12px; }
  .ep-modal .ep-note:focus { outline: none; border-color: var(--accent); }
  .ep-modal .ep-chip.noted { box-shadow: inset 0 0 0 1px var(--accent-soft); }
  .ep-modal .ep-chip .dot { color: var(--accent-soft); font-size: 0.62rem; }
  .ep-modal .ep-chip.on .dot { color: #fff; }
  .ep-modal .epc { margin: 0 0 12px; }
  .ep-modal .epc-lbl { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 5px; }
  .ep-modal .epc-lbl b { color: var(--accent-soft); }
  .ep-modal .epc input { width: 100%; box-sizing: border-box; background: var(--bg-elev); border: 1px solid var(--border);
    color: var(--text); border-radius: 7px; padding: 7px 9px; font-family: inherit; font-size: 0.85rem; }
  .ep-modal .epc input:focus { outline: none; border-color: var(--accent); }
  /* 視聴タイムライン */
  .tl-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .tl-title { font-size: 1.05rem; font-weight: 700; color: var(--text); }
  .tl-count { color: var(--text-faint); font-size: 0.82rem; font-weight: 500; margin-left: 6px; }
  .tl-clear { background: transparent; border: 1px solid var(--border); color: var(--text-faint); border-radius: 7px;
    padding: 6px 12px; font-family: inherit; font-size: 0.78rem; cursor: pointer; }
  .tl-clear:hover { color: var(--text); border-color: var(--border-strong); background: var(--bg-elev); }
  .tl-day { font-size: 0.82rem; font-weight: 700; color: var(--accent-soft); letter-spacing: 0.03em;
    margin: 18px 0 9px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
  .tl-day:first-of-type { margin-top: 0; }
  .tl-list { display: flex; flex-direction: column; gap: 7px; }
  .tl-item { display: flex; align-items: center; gap: 11px; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 9px; padding: 7px 10px 7px 7px; }
  .tl-item:hover { border-color: var(--border-strong); }
  .tl-thumb { width: 34px; height: 48px; object-fit: cover; border-radius: 5px; flex: 0 0 auto; cursor: pointer; background: var(--bg-elev); }
  .tl-noimg { display: block; }
  .tl-body { flex: 1; min-width: 0; cursor: pointer; }
  .tl-name { font-size: 0.88rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-what { font-size: 0.78rem; color: var(--text-dim); margin-top: 2px; }
  .tl-time { font-size: 0.78rem; color: var(--text-faint); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .tl-del { background: none; border: none; color: var(--text-faint); font-size: 0.9rem; cursor: pointer; flex: 0 0 auto; padding: 2px 4px; line-height: 1; }
  .tl-del:hover { color: var(--danger, #f87171); }
  /* マイページ「次に見る」キュー */
  .nextup { margin-bottom: 22px; }
  .nextup-head { font-size: 1.05rem; font-weight: 800; color: var(--accent-soft);
    background: rgba(124,92,255,.12); padding: 9px 16px; border-radius: 12px; border-left: 4px solid var(--accent); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .nextup-head .count { color: var(--text-faint); font-size: 0.82rem; font-weight: 600; }
  .nextup-grid { display: flex; flex-wrap: wrap; gap: 14px; }
  .nextup-card { width: 150px; }
  .nextup-card .nextup-info { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 6px; }
  .nextup-card .nextup-next { font-size: 0.78rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .nextup-card .nextup-next b { color: var(--accent-soft); }
  .nextup-card .nextup-btn { flex: 0 0 auto; background: var(--accent); border: 1px solid var(--accent); color: #fff; border-radius: 6px; padding: 4px 8px; font-family: inherit; font-size: 0.74rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .nextup-card .nextup-btn:hover { background: var(--accent-soft); border-color: var(--accent-soft); }
  .nextup-card .nextup-wait { flex: 0 0 auto; font-size: 0.72rem; color: var(--text-faint); white-space: nowrap; }
  /* 放送状態バッジ（作品単位）: airing=赤系 / upcoming=淡色 */
  .air-badge { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 5px; font-size: 0.68rem; font-weight: 700; white-space: nowrap; vertical-align: middle; }
  .air-badge.airing { color: #fff; background: #f87171; }
  .air-badge.upcoming { color: var(--text-dim); background: var(--bg-elev); border: 1px solid var(--border-strong); }
  .poster .prog.upcoming { color: var(--text-faint); }
  /* ホバー情報カード（作品名/原作/制作/メインキャラ） */
  .info-card { position: fixed; z-index: 65; min-width: 200px; max-width: 300px; background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); box-shadow: 0 16px 40px -12px rgba(0,0,0,.85); padding: 11px 13px; display: none; pointer-events: none; }
  .info-card.show { display: block; }
  .info-card .ic-title { font-size: 0.9rem; font-weight: 600; color: var(--text); line-height: 1.35; margin-bottom: 7px; }
  .info-card .ic-row { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 3px; display: flex; gap: 7px; }
  .info-card .ic-k { flex: 0 0 auto; color: var(--text-faint); }
  .info-card .ic-svs { display: flex; flex-wrap: wrap; gap: 4px; }
  .info-card .ic-sv { color: var(--accent-soft); font-size: 0.7rem; border: 1px solid var(--border-strong); padding: 0 6px; border-radius: 999px; white-space: nowrap; }
  .info-card .ic-narou { color: var(--accent-soft); font-size: 0.7rem; border: 1px solid var(--border-strong); padding: 0 6px; border-radius: 999px; align-self: center; }
  .info-card .ic-kakuyomu { color: var(--accent-soft); font-size: 0.7rem; border: 1px solid var(--border-strong); padding: 0 6px; border-radius: 999px; align-self: center; }
  .info-card .ic-mag { color: var(--accent-soft); font-size: 0.7rem; border: 1px solid var(--border-strong); padding: 0 6px; border-radius: 999px; align-self: center; }
  .info-card .ic-chars { margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--border); display: grid; gap: 3px; }
  .info-card .ic-char { font-size: 0.81rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info-card .ic-cv { color: var(--accent-soft); }
  .info-card .ic-more { color: var(--text-faint); }
  .info-card .ic-note { margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--border); font-size: 0.79rem; color: var(--text-dim); line-height: 1.5; }
  /* ---------- アニメ9選 ---------- */
  .b9-head { display: flex; align-items: baseline; gap: 10px; margin: 18px 0 4px; }
  .b9-head h2 { font-size: 18px; margin: 0; }
  .b9-cnt { color: var(--text-dim); font-size: 13px; }
  .b9-note { color: var(--text-dim); font-size: 13px; margin: 4px 0 12px; }
  .best9-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 520px; margin-bottom: 14px; }
  .best9-slot { position: relative; aspect-ratio: 2/3; border-radius: 10px; overflow: hidden;
    cursor: pointer; background: var(--bg-elev); border: 1px solid var(--border); }
  .best9-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .best9-slot .b9-ttl { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 8px 6px;
    font-size: 12px; font-weight: 700; background: linear-gradient(transparent, rgba(8, 9, 12, .92));
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .best9-slot.empty { display: flex; align-items: center; justify-content: center;
    border: 2px dashed var(--border); color: var(--text-dim); font-size: 26px; cursor: default; }
  .best9-slot.swap-src { outline: 3px solid var(--accent); outline-offset: -3px; }
  .b9-actions { margin-bottom: 20px; }
  .poster.b9-on { outline: 3px solid var(--accent); outline-offset: -3px; }
  .b9-mark { position: absolute; top: 6px; left: 6px; z-index: 2; background: var(--accent); color: #fff;
    font-weight: 800; font-size: 13px; width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; }
  /* ---------- 開発者モード（裏コマンド） ---------- */
  .dev-badge { display: none; margin-left: 10px; font-size: 12px; font-weight: 800; vertical-align: middle;
    color: var(--accent-soft); border: 1px solid var(--accent); border-radius: 6px; padding: 2px 8px; }
  body.dev-mode .dev-badge { display: inline-block; }
</style>

<body>
<div class="shell">
  <aside class="rail" id="rail">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input type="text" id="search" placeholder="作品名・制作会社・声優・原作者で検索..." oninput="onSearch()">
    </div>

    <nav class="rail-views">
      <button class="ytab collection" id="collection-btn" onclick="goCollection()">★ マイページ</button>
      <button class="ytab collection" id="reco-btn" onclick="goReco()">✨ おすすめ</button>
      <button class="ytab collection" id="timeline-btn" onclick="goTimeline()">🕒 タイムライン</button>

    <div class="rail-group">
      <div class="rail-label">状態</div>
      <div class="chips" id="filters">
        <button class="chip active" data-f="all" onclick="setFilter('all')">すべて</button>
        <button class="chip done" data-f="done" onclick="setFilter('done')">視聴済</button>
        <button class="chip watching" data-f="watching" onclick="setFilter('watching')">視聴中</button>
        <button class="chip planning" data-f="planning" onclick="setFilter('planning')">視聴予定</button>
        <button class="chip dropped" data-f="dropped" onclick="setFilter('dropped')">視聴中止</button>
        <button class="chip maybe" data-f="maybe" onclick="setFilter('maybe')">多分視聴済</button>
        <button class="chip" data-f="unwatched" onclick="setFilter('unwatched')">未マーク</button>
      </div>
    </div>

    <div class="rail-group">
      <div class="rail-label">形式</div>

        <button class="chip active" data-ff="all" onclick="setFormat('all')">すべて</button>
        <button class="chip" data-ff="TV" onclick="setFormat('TV')">TV</button>
        <button class="chip" data-ff="SHORT" onclick="setFormat('SHORT')">ショート</button>
        <button class="chip" data-ff="OVA" onclick="setFormat('OVA')">OVA</button>
        <button class="chip" data-ff="MOVIE" onclick="setFormat('MOVIE')">劇場アニメ</button>
      </div>
    </div>

    <div class="rail-group">
      <div class="rail-label">年で移動</div>
      <div class="yearbar" id="yearbar"></div>
    </div>
  </aside>

  <main class="main">
    <header>
      <div class="title-row">
        <div class="title-block">
          <h1>アニメモ！<span class="dev-badge">🛠 DEV</span></h1>
          <p class="subtitle">左クリックで視聴済／多分視聴済／未マークを切替。右クリックで全ステータス（視聴中・視聴中止の話数）と自分の評価（★1-5）を設定できます。</p>
          <p class="dev-note">※おすすめ機能は現在開発中です。</p>
          <p class="src-note" id="src-note"></p>
          <div class="stats" id="stats"></div>
          <div class="header-actions">
            <button class="ytab collection" id="recent-btn" onclick="goRecent()">🆕 新着更新分</button>
            <button class="ytab collection" id="series-btn" onclick="goSeries()">📺 見たいシリーズ</button>
            <button class="ytab" id="calendar-btn" onclick="openCalendar()">📅 放送カレンダー</button>
            <button class="ytab collection" id="best9-btn" onclick="goBest9()">🏆 アニメ9選</button>
            <button class="ytab" id="score-btn" onclick="toggleScores()">★ 海外評価値表示</button>
          </div>
        </div>
        <div class="context-panel" id="context-panel"></div>
      </div>
    </header>

    <div id="list"></div>

    <div class="foot-note">
      視聴状況はこのブラウザ内（localStorage）に保存されます。 ·
      <a onclick="openExportMenu(event)">視聴履歴を書き出し（JSON / CSV / JPEG）</a> ·
      <a onclick="importWatch()">読み込み</a> ·
      <a onclick="importCompare()">🆚 比較ファイルを追加</a>
    </div>

    <p class="src-credit">データ: <a href="https://anilist.co" target="_blank" rel="noopener">AniList (https://anilist.co)</a> ・ 総作品数：<span id="catalog-total"></span></p>
  </main>
</div>

<div class="toast" id="toast"></div>
<button class="to-top" id="to-top" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })" title="先頭へ戻る" aria-label="先頭へ戻る">↑</button>
<div class="ctx-menu" id="ctxmenu"></div>
<div class="ctx-menu" id="exportmenu"></div>

<div class="ep-overlay" id="epoverlay" onclick="closeEpModal()"></div>
<div class="ep-modal" id="epmodal" role="dialog" aria-modal="true"></div>

<div class="ep-modal note-modal" id="notemodal" role="dialog" aria-modal="true"></div>

<script>
const WATCH_KEY = "animeTV.watch.v1";
const HISTORY_KEY = "animeTV.history.v1"; // 視聴タイムライン（履歴ログ）。配列 [{id, ep, t}]、ep=0は作品単位
const HISTORY_MAX = 5000;                 // 履歴の上限件数（肥大化防止）
const SERIES_KEY = "animeTV.series.v1";   // シリーズ単位の「見たい」/「興味なし」localStorage キー
const COMPARE_KEY = "animeTV.compare.v1"; // 比較相手の視聴データ { name, watch:{id:{s,ep,r}}, importedAt }
const BEST9_KEY = "animeTV.best9.v1";     // アニメ9選（id配列・最大9件、並び=3×3グリッドの枠順）。※キー定数はここで定義（TDZ回避）
const DEV_KEY = "animeTV.dev.v1";         // 開発者モード（裏コマンド）フラグ。"1"=ON
const SEASON_JA = { WINTER: "冬", SPRING: "春", SUMMER: "夏", FALL: "秋", OVA: "OVA", MOVIE: "劇場アニメ" };
const SEASON_CLS = { WINTER: "s-winter", SPRING: "s-spring", SUMMER: "s-summer", FALL: "s-fall", OVA: "s-ova", MOVIE: "s-movie" };
const SEASON_ORDER = { WINTER: 0, SPRING: 1, SUMMER: 2, FALL: 3, OVA: 4, MOVIE: 5 };
// 表示用の並び順: クールは秋→夏→春→冬の降順（新しいクールを上に＝見やすく）。
// OVA・劇場版は従来どおり全クールの後ろ（順番は変えない）。
const SEASON_ORDER_DISPLAY = { FALL: 0, SUMMER: 1, SPRING: 2, WINTER: 3, OVA: 4, MOVIE: 5 };
const CURRENT_YEAR = new Date().getFullYear();
// 現行年は放送進行に沿った暦順（冬→秋）、過去年は逆順（秋→冬）で表示する。
function seasonOrder(year) { return year === CURRENT_YEAR ? SEASON_ORDER : SEASON_ORDER_DISPLAY; }
// 左クリックは「視聴済→多分視聴済→未マーク」の3状態のみを巡回（視聴中/視聴中止は右クリックから設定）。
const LEFT_NEXT = { unwatched: "done", done: "maybe", maybe: "unwatched" };
const STATUS_JA = { done: "視聴済", watching: "視聴中", planning: "視聴予定", dropped: "視聴中止", maybe: "多分視聴済", unwatched: "未マーク" };
// 右クリックメニューで選べる全状態（表示順）
const CTX_STATES = [["unwatched", "未マーク"], ["planning", "視聴予定"], ["watching", "視聴中"], ["done", "視聴済"], ["dropped", "視聴中止"], ["maybe", "多分視聴済"]];
const FMT_JA = { TV: "TV", SHORT: "ショート", OVA: "OVA", MOVIE: "劇場アニメ" };
// 複数選択フィルタの対象キー（「すべて」= 全キー選択状態）
const STATUS_KEYS = ["done", "watching", "planning", "maybe", "dropped", "unwatched"];
const FORMAT_KEYS = ["TV", "SHORT", "OVA", "MOVIE"];

let catalog = [];
let years = [];
let watch = loadWatch();
let history = loadHistory();   // 視聴タイムライン（新着順の配列 [{id, ep, t}]）
let series = loadSeries();   // シリーズ単位の「見たい」/「興味なし」 { want:{key:1}, hide:{key:-2} }
let compare = loadCompare(); // 比較相手の視聴データ（null か {name, watch, importedAt}）
let compareCat = "all";      // 比較ビューの絞り込み: "all" | "both"(共通) | "mine"(自分のみ) | "theirs"(相手のみ)
let best9 = loadBest9();     // アニメ9選（id配列・最大9件、並び=3×3グリッドの枠順）
let best9SwapIdx = null;     // 9選グリッドで入れ替え元に選択中の枠index（null=未選択）
let devMode = false;         // 開発者モード（裏コマンドでON/OFF、localStorageに永続化）
try { devMode = localStorage.getItem(DEV_KEY) === "1"; } catch (e) {}
let view = { mode: "year", year: null };   // mode: "year" | "collection" | "recent" | "reco" | "series" | "compare" | "timeline" | "best9"
let collectionSort = "season";   // 視聴コレクション内の並び: "season"(年代/クール別) | "rating"(自己評価別)
let query = "";
let statusFilter = new Set(STATUS_KEYS);   // 複数選択（既定: 全選択 = すべて）
let formatFilter = new Set(FORMAT_KEYS);    // 複数選択（既定: 全選択 = すべて）
let showScores = false;   // 評価値（★）の表示。デフォルト非表示
let collapsedDecades = new Set(); // 折りたたみ中の年代（collection モード用、キー=10年区切りの開始年）
let collapsedYears = new Set();   // 折りたたみ中の年（collection モード用）
let collapsedCours = new Set();   // 折りたたみ中のクール（キー=`${year}-${season}`）
let courTouched = new Set();      // ユーザーが手動開閉したクール（既定折りたたみより優先）
let railFoldedDecades = new Set(); // 左レール年ナビで畳んでいる年代（最新年代以外を初期で畳む）
let railFoldInit = false;

/* ---------- スクロール位置の記憶（ページ更新=F5 でリセット） ----------
   ビューごと（年別の各年・マイページ・おすすめ等・検索）に最後のスクロール位置を保持し、
   同じビューへ戻ったときに元の位置まで復元する。localStorage には保存しないので
   リロードすると全て先頭に戻る。 */
let scrollMem = {};            // { viewKey: スクロールY }
let activeScrollKey = "";      // 現在表示中ビューのキー（scroll イベントの保存先）
let lastNav = null;            // 直前に表示していたビュー { mode, year, query }（ページボタン再クリックで戻る先）
function viewScrollKey() { return query ? `search:${query}` : `${view.mode}:${view.year ?? ""}`; }
function saveScroll() { if (activeScrollKey) scrollMem[activeScrollKey] = window.scrollY; }
// scroll イベントで現在ビューの位置を随時記録（次に戻ってきたとき復元するため）。
window.addEventListener("scroll", () => { if (activeScrollKey) scrollMem[activeScrollKey] = window.scrollY; }, { passive: true });
// ビュー切替の共通処理:
//  ・別ビューへ移動 → 旧ビューの位置を保存し、来たビューを lastNav に記録、新ビューは記憶位置へ復元。
//  ・既に表示中の「ページボタン」（マイページ等＝年別以外）を再クリック → 直前に見ていた
//    ビュー（lastNav）へ戻り、そのスクロール位置を復元する。年別タブの再クリックは現状維持。
// いずれも記憶があれば前回見ていたスクロール位置へ復元する（無ければ先頭）。
function navigate(mutate) {
  const prevKey = activeScrollKey;                         // 切替前ビューのキー
  const fromState = { mode: view.mode, year: view.year, query };   // 切替前のビュー
  saveScroll();                          // 旧ビューの最終位置を保存（activeScrollKey はまだ旧キー）
  mutate();                              // view / query / 各種フラグを更新
  let newKey = viewScrollKey();
  if (newKey === prevKey && view.mode !== "year" && lastNav) {
    // ページボタンの再クリック（例: マイページ→マイページ）→ 元いたビューへ戻る
    const back = lastNav;
    lastNav = fromState;                 // 戻り先を入れ替え（往復できるように）
    view = { mode: back.mode, year: back.year };
    query = back.query || "";
    document.getElementById("search").value = query;
    newKey = viewScrollKey();
  } else if (newKey !== prevKey) {
    lastNav = fromState;                 // どのビューから来たかを記録
  }
  activeScrollKey = newKey;              // 先に新キーへ。render後の高さ変化で旧キーを汚さない
  renderYearbar();
  render();
  window.scrollTo({ top: scrollMem[activeScrollKey] ?? 0, behavior: "auto" });   // 前回見ていた位置へ復元
}

/* ---------- persistence ----------
   watch[id] = { s: 状態, ep: 話数, r: 自分評価1-5 }。
   旧形式（watch[id] = "状態" の文字列）は読み込み時にオブジェクトへ移行する。 */
function migrateWatch(raw) {
  const out = {};
  if (!raw || typeof raw !== "object") return out;
  for (const id in raw) {
    const v = raw[id];
    if (typeof v === "string") { if (v && v !== "unwatched") out[id] = { s: v }; }
    else if (v && typeof v === "object") {
      const e = {};
      if (v.s && v.s !== "unwatched") e.s = v.s;
      if (v.ep > 0) e.ep = v.ep;
      if (v.r > 0) e.r = v.r;
      if (v.x) e.x = v.x;
      if (Array.isArray(v.eps)) { const e2 = [...new Set(v.eps.filter(n => n > 0))].sort((a, b) => a - b); if (e2.length) { e.eps = e2; e.ep = e2.length; } }
      else if (v.ep > 0) { const e2 = []; for (let i = 1; i <= v.ep; i++) e2.push(i); e.eps = e2; e.ep = v.ep; }   // 話別記録(eps)導入前のカウントのみ記録を [1..ep] に移行
      if (typeof v.n === "string" && v.n.trim()) e.n = v.n;
      if (v.en && typeof v.en === "object" && !Array.isArray(v.en)) {
        const en = {};
        for (const k in v.en) { const c = v.en[k]; if (k > 0 && typeof c === "string" && c.trim()) en[k] = c; }
        if (Object.keys(en).length) e.en = en;
      }
      if (e.s || e.r || e.x || e.eps || e.n || e.en) out[id] = e;
    }
  }
  return out;
}
function loadWatch() {
  try { const r = localStorage.getItem(WATCH_KEY); if (r) return migrateWatch(JSON.parse(r)); }
  catch (e) { console.error(e); }
  return {};
}
function saveWatch() {
  try { localStorage.setItem(WATCH_KEY, JSON.stringify(watch)); }
  catch (e) { alert("保存に失敗: " + e.message); }
}

/* ---------- 視聴タイムライン（履歴ログ） ---------- */
// 履歴は新着順の配列。各要素 { id:作品ID, ep:話番号(0=作品単位), t:ISO日時 }。
function loadHistory() {
  try {
    const r = localStorage.getItem(HISTORY_KEY);
    if (r) { const a = JSON.parse(r); if (Array.isArray(a)) return a.filter(e => e && e.id != null && e.t); }
  } catch (e) { console.error(e); }
  return [];
}
function saveHistory() {
  try { if (history.length > HISTORY_MAX) history = history.slice(0, HISTORY_MAX); localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }
  catch (e) { console.error(e); }
}
// 視聴イベントを履歴の先頭へ追加（新規視聴時のみ呼ばれる）。
function pushHistory(id, ep) {
  history.unshift({ id, ep: ep || 0, t: new Date().toISOString() });
  saveHistory();
}
function statusOf(id) { return (watch[id] && watch[id].s) || "unwatched"; }
// 視聴済み話数（表示・CSV用のカウント）。eps があれば eps.length を優先。
function epOf(id) { const w = watch[id]; if (!w) return 0; return Array.isArray(w.eps) ? w.eps.length : (w.ep || 0); }
function ratingOf(id) { return (watch[id] && watch[id].r) || 0; }
// 作品ごとの感想テキスト / 各話の一言コメント。
function noteOf(id) { return (watch[id] && watch[id].n) || ""; }
function epNoteOf(id, n) { const en = watch[id] && watch[id].en; return (en && en[n]) || ""; }
// 作品の感想を設定（空文字で削除）。再描画は呼び出し側。
function setNote(id, text) {
  const cur = watch[id] || {};
  const t = (text || "").trim();
  if (t) cur.n = t; else delete cur.n;
  if (cur.s || cur.r || cur.x || cur.n || cur.en) watch[id] = cur; else delete watch[id];
  saveWatch();
}
// 各話の一言コメントを設定（空文字でキー削除、マップ空なら en ごと削除）。
function setEpNote(id, n, text) {
  const cur = watch[id] || {};
  const en = cur.en || {};
  const t = (text || "").trim();
  if (t) en[n] = t; else delete en[n];
  if (Object.keys(en).length) cur.en = en; else delete cur.en;
  if (cur.s || cur.r || cur.x || cur.n || cur.en || (Array.isArray(cur.eps) && cur.eps.length)) watch[id] = cur; else delete watch[id];
  saveWatch();
}

/* ---------- エピソード単位の視聴記録（eps = 視聴済み話番号の昇順int配列, 1始まり） ---------- */
function epsOf(id) { const e = watch[id] && watch[id].eps; return Array.isArray(e) ? e : []; }
// total(総話数) が分かるとき、未視聴の最小話番号を返す。全話済み/total不明なら null。
function nextEp(id, total) {
  if (!(total > 0)) return null;
  const set = new Set(epsOf(id));
  for (let n = 1; n <= total; n++) if (!set.has(n)) return n;
  return null;
}
// eps を書き込み、状態を自動調整して保存する共通処理。
function commitEps(id, arr, total) {
  const eps = [...new Set(arr.filter(n => n > 0))].sort((a, b) => a - b);
  const cur = watch[id] || {};
  // 新規に追加された話番号を視聴履歴(タイムライン)へ記録（削除では記録しない）。
  const prev = new Set(Array.isArray(cur.eps) ? cur.eps : []);
  for (const n of eps) if (!prev.has(n)) pushHistory(id, n);
  const e = {};
  if (cur.r > 0) e.r = cur.r;
  if (cur.x) e.x = cur.x;
  if (cur.n) e.n = cur.n;
  if (cur.en) e.en = cur.en;
  if (eps.length) {
    e.eps = eps; e.ep = eps.length;
    if (total > 0 && eps.length >= total) e.s = "done";
    else if (cur.s === "dropped") e.s = "dropped";   // 中止状態は維持
    else e.s = "watching";
  } else {
    // 全解除: 進捗を消すが視聴状態(視聴予定/多分等)・評価・除外は保持。watching/done/dropped は未マークへ。
    if (cur.s && cur.s !== "watching" && cur.s !== "done" && cur.s !== "dropped") e.s = cur.s;
  }
  if (e.s || e.r || e.x || e.eps || e.n || e.en) watch[id] = e; else delete watch[id];
  saveWatch();
}
function toggleEp(id, n, total) {
  const set = new Set(epsOf(id));
  if (set.has(n)) set.delete(n); else set.add(n);
  commitEps(id, [...set], total);
}
function markUpTo(id, n, total) {
  const arr = [];
  for (let i = 1; i <= n; i++) arr.push(i);
  commitEps(id, arr, total);
}
function markAllEps(id, total) { if (total > 0) markUpTo(id, total, total); }
function clearEps(id) { commitEps(id, [], 0); }
// おすすめ除外フラグ（「興味なし／見る予定なし」）。視聴状態・評価とは独立に持つ。
function isHidden(id) { return !!(watch[id] && watch[id].x); }

// 状態を設定。unwatched は状態を消すが自分評価は保持する。
function setStatus(id, status, ep) {
  const cur = watch[id] || {};
  // 話別記録の無い作品（劇場等）を新たに「視聴済」にした時は作品単位イベントを履歴へ。
  if (status === "done" && cur.s !== "done" && !(Array.isArray(cur.eps) && cur.eps.length)) pushHistory(id, 0);
  const e = {};
  if (cur.r > 0) e.r = cur.r;
  if (cur.x) e.x = cur.x;   // おすすめ除外フラグは状態変更でも維持
  if (cur.n) e.n = cur.n;
  if (cur.en) e.en = cur.en;
  if (status && status !== "unwatched") {
    e.s = status;
    // 話別記録(eps)があれば状態変更でも引き継ぐ。無ければ従来のカウントを保持。
    if (Array.isArray(cur.eps) && cur.eps.length) { e.eps = cur.eps; e.ep = cur.eps.length; }
    else if ((status === "watching" || status === "dropped") && ep > 0) e.ep = ep;
  }
  // status === "unwatched": eps/ep を引き継がない（未マークで進捗もクリア）
  if (e.s || e.r || e.x || e.eps || e.n || e.en) watch[id] = e; else delete watch[id];
  saveWatch();
  renderContextPanel();   // 傾向グラフを最新の視聴状態で更新
}
// 「ここまで見た: N話」入力。eps=[1..N] に正規化（markUpTo 経由で状態も自動調整）。再描画は呼び出し側。
function setEp(id, val) {
  const a = catalog.find(x => x.id === id);
  const total = (a && a.ep) ? a.ep : 0;
  const n = parseInt(val, 10);
  if (n > 0) markUpTo(id, n, total); else clearEps(id);
}

// 自分評価（1-5。同じ星を再クリックで解除）。
function setRating(id, r) {
  const cur = watch[id] || {};
  if (r > 0) cur.r = r; else delete cur.r;
  if (cur.s || cur.r || cur.x || cur.n || cur.en) watch[id] = cur; else delete watch[id];
  saveWatch();
  renderContextPanel();   // 評価タブの傾向グラフを更新
}
// おすすめ除外フラグのトグル（視聴状態・評価は保持）。再描画は呼び出し側に任せる。
function toggleHidden(id) {
  const cur = watch[id] || {};
  if (cur.x) delete cur.x; else cur.x = 1;
  if (cur.s || cur.r || cur.x || cur.n || cur.en) watch[id] = cur; else delete watch[id];
  saveWatch();
}

/* ---------- シリーズ単位の「見たい」/「興味なし」 ----------
   シリーズ = 同一ベースタイトル（seriesKey）。作品単位の x フラグ(isHidden)とは独立に併存する。
   want: そのシリーズを「見たいリスト」に入れる（専用ビューで表示・おすすめ候補からは除外）。
   hide: そのシリーズを丸ごと興味なし（おすすめ候補・好みプロファイルの種から除外）。
   ※ SERIES_KEY は WATCH_KEY 隣で定義（loadSeries が初期化時に参照するため TDZ 回避）。 */
function loadSeries() {
  try {
    const r = localStorage.getItem(SERIES_KEY);
    if (r) { const o = JSON.parse(r); return { want: o.want || {}, hide: o.hide || {} }; }
  } catch (e) { console.error(e); }
  return { want: {}, hide: {} };
}
function saveSeries() {
  try { localStorage.setItem(SERIES_KEY, JSON.stringify(series)); }
  catch (e) { alert("保存に失敗: " + e.message); }
}
/* ---------- アニメ9選の永続化 ----------
   best9 = 選んだ作品idの配列（最大9件、並び順=3×3グリッドの枠順）。
   ※ BEST9_KEY は WATCH_KEY 隣で定義（初期化時参照の TDZ 回避、SERIES_KEY と同じ理由）。 */
function loadBest9() {
  try {
    const r = localStorage.getItem(BEST9_KEY);
    if (r) { const o = JSON.parse(r); if (Array.isArray(o)) return o.filter(x => x != null).slice(0, 9); }
  } catch (e) { console.error(e); }
  return [];
}
function saveBest9() {
  try { localStorage.setItem(BEST9_KEY, JSON.stringify(best9)); }
  catch (e) { alert("保存に失敗: " + e.message); }
}
// フランチャイズ統合: 劇場版などサブタイトルが毎作変わり、ベースタイトルでまとめられない
// 長期シリーズを 1 つのキーに束ねる。原題に対するパターンで判定する（追加もここだけで済む）。
const FRANCHISE_RULES = [
  { re: /ポケットモンスター|ポケモン/, key: "@franchise/pokemon" },
];
function franchiseKey(t) {
  for (const r of FRANCHISE_RULES) if (r.re.test(t || "")) return r.key;
  return null;
}
// 同一ベースタイトルのキー（フランチャイズ統合 → 続編表記を除去＋表記ゆれ正規化）。_sk と同様に遅延キャッシュ。
function seriesKey(a) {
  if (a._series === undefined) a._series = franchiseKey(a.t) || kanaFold(primeBaseTitle(a.t));
  return a._series;
}
function isSeriesWanted(a) { return !!series.want[seriesKey(a)]; }
function isSeriesHidden(a) { return !!series.hide[seriesKey(a)]; }
// 再描画は呼び出し側に任せる（toggleHidden と同方針）。
function toggleSeriesWant(a) {
  const k = seriesKey(a);
  if (series.want[k]) delete series.want[k]; else series.want[k] = 1;
  saveSeries();
}
function toggleSeriesHide(a) {
  const k = seriesKey(a);
  if (series.hide[k]) delete series.hide[k]; else series.hide[k] = -2;
  saveSeries();
}

/* ---------- 視聴比較（他人と自分の対比）----------
   相手が書き出した視聴履歴 JSON（自分の export と同形式 {id:{s,ep,r}}）を読み込み、
   クールごとに自分／相手の視聴状況を対比する。compare = {name, watch, importedAt} か null。 */
function loadCompare() {
  try {
    const r = localStorage.getItem(COMPARE_KEY);
    if (r) { const o = JSON.parse(r); if (o && o.watch && typeof o.watch === "object") return o; }
  } catch (e) { console.error(e); }
  return null;
}
function saveCompare() {
  try {
    if (compare) localStorage.setItem(COMPARE_KEY, JSON.stringify(compare));
    else localStorage.removeItem(COMPARE_KEY);
  } catch (e) { console.error(e); }
}
function cmpStatusOf(id) { return (compare && compare.watch[id] && compare.watch[id].s) || "unwatched"; }
function cmpRatingOf(id) { return (compare && compare.watch[id] && compare.watch[id].r) || 0; }
// 比較カテゴリ: both=両者視聴 / mine=自分のみ / theirs=相手のみ / none=どちらも未視聴
function cmpCat(id) {
  const me = statusOf(id) !== "unwatched";
  const them = cmpStatusOf(id) !== "unwatched";
  return me && them ? "both" : me ? "mine" : them ? "theirs" : "none";
}

/* ---------- helpers ---------- */
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function courLabel(ep) {
  if (!ep) return null;
  if (ep > 13) return { multi: true, text: ep > 52 ? "長期" : "連続" + Math.max(2, Math.round(ep / 13)) + "クール" };
  return null;
}
// 手動クール補正(co=総クール数/sp=分割)があればそれを優先。無ければ ep 由来の courLabel。
function courLabelFor(a) {
  if (a.co) return { multi: true, text: (a.sp ? "分割" : "連続") + a.co + "クール" };
  return courLabel(a.ep);
}
// クールの暦順。現クール（今放送中のクール）は今日の月から算出する。
const SEASON_CAL = ["WINTER", "SPRING", "SUMMER", "FALL"];
function currentCour() {
  const now = new Date();
  return { year: now.getFullYear(), season: SEASON_CAL[Math.floor(now.getMonth() / 3)] };
}
// 放送開始の時系列キー（古い順ソート用）。放映日(d, YYYYMMDD)優先、無ければ年＋クール頭月で代用。
const SEASON_MONTH = { WINTER: 1, SPRING: 4, SUMMER: 7, FALL: 10, OVA: 1, MOVIE: 1 };
function chronoKey(a) {
  if (a.d) return a.d;
  return a.y * 10000 + (SEASON_MONTH[a.s] || 1) * 100 + 1;
}
// 放送話数からクール数を推定（courLabel と同じ基準）。0=不明 / 99=長期(>52話)。
function courCount(ep) {
  if (!ep) return 0;
  if (ep > 52) return 99;
  if (ep > 13) return Math.max(2, Math.round(ep / 13));
  return 1;
}
// 連続2〜3クール作品 a の放送期間が cour cc を含むか（開始クール自身も含む）。長期(>52話)・1クールは対象外。
function airsCourSpan(a, cc) {
  if (a.f !== "TV" && a.f !== "SHORT") return false;
  if (a.cs) return a.cs.includes(`${cc.year}-${cc.season}`);   // 手動クール範囲(分割/連続)を優先
  if (!SEASON_CAL.includes(a.s)) return false;
  const k = courCount(a.ep);
  if (k < 2 || k >= 4) return false;
  let yi = a.y, si = SEASON_CAL.indexOf(a.s);
  for (let n = 0; n < k; n++) {
    if (yi === cc.year && SEASON_CAL[si] === cc.season) return true;
    si++; if (si > 3) { si = 0; yi++; }
  }
  return false;
}
// 現クール cc に「継続放送中」として複製表示すべき作品（開始クールは別）を返す。
// 対象: TV/ショートのクール作品で 2〜3クール（1クールは継続なし／4クール以上=長期は除外）、
// かつ放送期間が cc を含み、かつ開始クールが cc 自身ではない（開始クールには既に表示済み）。
function continuingInCour(cc) {
  return catalog.filter(a => {
    if (a.f !== "TV" && a.f !== "SHORT") return false;
    if (!passStatus(a)) return false;
    // 手動クール範囲(cs)がある作品は ep 由来の推定より優先。判明クールに含まれ、開始クールでなければ継続表示。
    if (a.cs) return a.cs.includes(`${cc.year}-${cc.season}`) && !(a.y === cc.year && a.s === cc.season);
    if (!SEASON_CAL.includes(a.s)) return false;
    const k = courCount(a.ep);
    if (k < 2 || k >= 4) return false;
    let yi = a.y, si = SEASON_CAL.indexOf(a.s);
    for (let n = 0; n < k; n++) {
      if (yi === cc.year && SEASON_CAL[si] === cc.season) {
        return !(a.y === cc.year && a.s === cc.season);
      }
      si++; if (si > 3) { si = 0; yi++; }
    }
    return false;
  });
}

function init() {

/* ---------- yearbar sync ---------- */
function syncYearbars() {
  const top = document.getElementById("yearbar");
  const bottom = document.getElementById("yearbar-bottom");
  if (!top || !bottom) return;

  const sync = (from, to) => {
    if (!syncing) { syncing = true; to.scrollLeft = from.scrollLeft; syncing = false; }
  };
  top.addEventListener("scroll", () => sync(top, bottom));
  bottom.addEventListener("scroll", () => sync(bottom, top));
}

function yearbarHtml() {
  // 年を年代でグルーピングし、年代見出しで開閉する縦ナビ（新しい年代・年が上）。
  const byDec = {};
  for (const y of years) (byDec[decadeOf(y)] = byDec[decadeOf(y)] || []).push(y);
  const decs = Object.keys(byDec).map(Number).sort((a, b) => b - a);
  if (!railFoldInit && decs.length) {   // 初期表示は最新年代のみ開き、他は畳む
    decs.slice(1).forEach(d => railFoldedDecades.add(d));
    railFoldInit = true;
  }
  return decs.map(d => {
    const folded = railFoldedDecades.has(d);
    const yrs = byDec[d].slice().sort((a, b) => b - a);
    const btns = yrs.map(y =>
      `<button class="ytab ${view.mode === "year" && view.year === y ? "active" : ""}" onclick="goYear(${y})">${y}</button>`
    ).join("");

      <div class="rail-dec-years">${btns}</div>

  }).join("");
}

/* ---------- filters（複数選択トグル） ----------
   「すべて」= 全選択状態（個別チップが全点灯）。

   ・「すべて」以外を押すと、そのキーだけをトグル（全選択状態からは1つ外れる）。 */
function toggleFilterSet(set, keys, value) {
  if (value === "all") {
    if (set.size === keys.length) set.clear();          // 全選択 → 全解除
    else { set.clear(); keys.forEach(k => set.add(k)); } // それ以外 → 全選択
  } else {
    if (set.has(value)) set.delete(value); else set.add(value);
  }
}
function syncChips(containerId, attr, set, keys) {

    const v = c.dataset[attr];

    c.classList.toggle("active", active);
  });
}

}

function studioJa(name) { return STUDIO_JA[name] || name; }
// 「A・B」形式（複数社連結）の各社を日本語化して返す（表示用）。未登録は英語のまま。
function studioDisplay(st) { return st ? st.split("・").map(studioJa).join("・") : st; }

// カタカナ⇄ひらがなと全角/半角の表記ゆれを吸収する検索用正規化。
function kanaFold(s) {
  if (!s) return "";
  s = s.normalize("NFKC").toLowerCase();   // 半角カナ→全角カナ・全角英数→半角 等
  let out = "";
  for (const ch of s) {
    const c = ch.codePointAt(0);
    out += (c >= 0x30A1 && c <= 0x30F6)    // カタカナ → ひらがな（長音ーは対象外で保持）
      ? String.fromCodePoint(c - 0x60) : ch;
  }
  return out;
}

// タイトル/ローマ字/制作会社/原作者/声優・キャラ名を1つの折りたたみ済み文字列に（遅延キャッシュ）。
function searchKey(a) {
  if (a._sk !== undefined) return a._sk;
  const parts = [a.t, a.tr, a.st, studioDisplay(a.st), a.au];
  if (a.ch) for (const p of a.ch) { parts.push(p[0]); if (p[1]) parts.push(p[1]); }
  a._sk = kanaFold(parts.filter(Boolean).join(" "));
  return a._sk;
}

// 視聴時間(分)を「◯分 / ◯時間 / ◯日◯時間」に整形。
function fmtWatchTime(min) {
  if (!min) return "0分";
  const h = Math.floor(min / 60);
  if (h < 1) return `${min}分`;
  if (h < 48) return `${h}時間`;
  return `${Math.floor(h / 24)}日${h % 24}時間`;
}
function renderStats() {
  let done = 0, watching = 0, maybe = 0, dropped = 0, planning = 0;
  let totalEps = 0, movieDone = 0;
  for (const id in watch) {
    const v = (watch[id] || {}).s;
    if (v === "done") done++; else if (v === "watching") watching++; else if (v === "maybe") maybe++; else if (v === "dropped") dropped++; else if (v === "planning") planning++;
    // 視聴話数は「視聴済」=全話(a.ep)、「視聴中」=記録した進捗(epOf)を加算。
    // 旧データ（話数記録なしで視聴済にしたもの）も視聴済なら全話として計上する。
    const a = catalog.find(x => x.id === +id);
    if (v === "done") {
      if (a && a.f === "MOVIE") movieDone++;
      else totalEps += (a && a.ep) ? a.ep : epOf(id);
    } else if (v === "watching") {
      totalEps += epOf(id);
    }
  }
  const watchMin = totalEps * 24 + movieDone * 120;   // TV/話=24分概算、劇場=120分概算
  document.getElementById("stats").innerHTML = `

    <div class="stat dropped"><span class="num">${dropped}</span><span class="lbl">視聴中止</span></div>
    <div class="stat maybe"><span class="num">${maybe}</span><span class="lbl">多分視聴済</span></div>
    <div class="stat eps"><span class="num">${totalEps.toLocaleString()}</span><span class="lbl">視聴話数</span></div>
    <div class="stat time"><span class="num">${fmtWatchTime(watchMin)}</span><span class="lbl">視聴時間</span></div>`;
  const tc = document.getElementById("catalog-total");
  if (tc) tc.textContent = catalog.length.toLocaleString();
