/* ---------- 右上コンテキストパネル ---------- */
let panelStat = "source";   // 視聴の傾向パネルの集計軸: "source"(原作) | "decade" | "studio" | "rating"

// クール作品の毎週の放送枠を {day(0=日), mins(0時からの分), time("HH:MM")} で返す。
// air(第1話airingAt, unix秒UTC)優先＝JST固定(+9h)。無ければ bc=[曜日, "HH:MM"]。どちらも無ければ null。
function airSlot(a) {
  if (a.air) {
    const j = new Date(a.air * 1000 + 9 * 3600 * 1000);
    const h = j.getUTCHours(), m = j.getUTCMinutes();
    return { day: j.getUTCDay(), mins: h * 60 + m, time: `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}` };
  }
  if (Array.isArray(a.bc) && a.bc.length) {
    const t = a.bc[1] || "";
    const mt = /^(\d{1,2}):(\d{2})$/.exec(t);
    return { day: a.bc[0], mins: mt ? (+mt[1] * 60 + +mt[2]) : 1e9, time: t || "--:--" };
  }
  return null;
}
// 作品の放送状態を判定: "upcoming"(放送開始前) / "airing"(放送中) / "finished"(完結) / null(不明)。
// d(YYYYMMDD放送開始)・air(次回放送 airingAt, Unix秒)・現クールから推定。エピソード単位ではなく作品単位。
function airStatus(a) {
  if (!a || !a.d) return null;
  const now = new Date();
  const todayInt = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
  const startInt = a.d % 100 === 0 ? a.d + 1 : a.d;   // 日不明(月初粒度)は月初扱い
  if (startInt > todayInt) return "upcoming";
  if (a.air && a.air * 1000 > now.getTime()) return "airing";   // 次回放送が未来＝放送中
  const cc = currentCour();
  if ((a.f === "TV" || a.f === "SHORT") && a.y === cc.year && a.s === cc.season) return "airing";
  if (airsCourSpan(a, cc)) return "airing";   // 連続2〜3クールが現クールに跨る（開始クールが前期で air が古い場合）
  return "finished";
}
// 放送状態のバッジ文言。airing/upcoming のみ文字を返す（finished/null は空）。
function airLabel(a) {
  const s = airStatus(a);
  if (s === "upcoming") return `📅 ${fmtDateInt(a.d)} 放送開始`;
  if (s === "airing") return "🔴 放送中";
  return "";
}
// 現クール放送中の作品（開始クール作品＋別クール開始の継続作品）を重複排除して返す。
function currentlyAiring() {
  const cc = currentCour();
  const seen = new Map();
  for (const a of catalog) if ((a.f === "TV" || a.f === "SHORT") && a.y === cc.year && a.s === cc.season) seen.set(a.id, a);
  for (const a of continuingInCour(cc)) seen.set(a.id, a);
  return [...seen.values()];
}
// 通常時パネル: 今週の放送表（横=曜日 月→日 / 縦=放送時刻順）。
function schedulePanelHtml() {
  const cc = currentCour();
  const ccLabel = `${cc.year}年 ${SEASON_JA[cc.season]}クール`;
  const shows = currentlyAiring();
  const slots = [];
  let undated = 0;
  const DAY_HIDE_FROM = 5 * 60, DAY_HIDE_TO = 15 * 60;   // 5:00〜15:00 の昼間アニメはカレンダーに表示しない
  for (const a of shows) {
    const s = airSlot(a);
    if (!s) { undated++; continue; }
    if (s.mins >= DAY_HIDE_FROM && s.mins < DAY_HIDE_TO) continue;
    slots.push({ a, ...s });
  }
  const head = `<div class="cp-title"><span>📺 今週の放送 <span style="color:var(--text-faint);font-weight:600">${ccLabel}</span></span></div>`;
  if (!shows.length) return `${head}<div class="sched-empty">現クールの放送情報がありません。</div>`;
  const dayOrder = [0, 1, 2, 3, 4, 5, 6];   // 日月火水木金土（日曜始まり）
  const cols = dayOrder.map(d => {
    const items = slots.filter(s => s.day === d).sort((x, y) => x.mins - y.mins);
    const rows = items.map(s => `<div class="sched-item" onmouseenter="showInfo(event, ${s.a.id})" onmouseleave="hideInfo()"><span class="t">${s.time}</span><span class="n">${esc(s.a.t)}</span></div>`).join("") || `<div class="sched-empty">—</div>`;
    return `<div class="sched-day"><div class="sched-day-h">${WEEKDAY_JA[d]}</div>${rows}</div>`;
  }).join("");
  return `${head}<div class="sched">${cols}</div>${undated ? `<div class="sched-empty" style="margin-top:7px">放送枠不明 ${undated}本</div>` : ""}`;
}
/* ---------- 放送カレンダー（別ページオーバーレイ） ---------- */
let calY = null, calM = null;   // 表示中の年・月(0-11)。null=未初期化
function openCalendar() {
  if (calY === null) { const n = new Date(); calY = n.getFullYear(); calM = n.getMonth(); }
  document.getElementById("cal-overlay").classList.add("open");
  document.body.style.overflow = "hidden";
  renderCalendar();
}
function closeCalendar() {
  document.getElementById("cal-overlay").classList.remove("open");
  document.body.style.overflow = "";
  hideInfo();
}
function calNav(delta) {
  calM += delta;
  if (calM < 0) { calM = 11; calY--; } else if (calM > 11) { calM = 0; calY++; }
  renderCalendar();
}
function calToday() { const n = new Date(); calY = n.getFullYear(); calM = n.getMonth(); renderCalendar(); }
// 現クール放送中の作品を、表示中の月の各日付に割り当てる。
// air(初回放送UNIX秒)＋話数があれば毎週進めて実日付に配置、無ければ bc の曜日で月内に毎週反復。
function calItemsByDay() {
  const DAY_HIDE_FROM = 5 * 60, DAY_HIDE_TO = 15 * 60;   // 昼間アニメは放送表と同様に非表示
  const byDay = {};
  const add = (day, time, mins, a) => {
    if (mins >= DAY_HIDE_FROM && mins < DAY_HIDE_TO) return;
    (byDay[day] = byDay[day] || []).push({ time, mins, a });
  };
  const daysInMonth = new Date(calY, calM + 1, 0).getDate();
  for (const a of currentlyAiring()) {
    const ep = (a.air && a.ep && a.ep > 0 && a.ep <= 200) ? a.ep : null;
    if (ep) {
      for (let k = 0; k < ep; k++) {
        const d = new Date(a.air * 1000 + k * 7 * 86400000 + 9 * 3600000);   // JST、毎週1話
        if (d.getUTCFullYear() === calY && d.getUTCMonth() === calM) {
          const h = d.getUTCHours(), m = d.getUTCMinutes();
          add(d.getUTCDate(), `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`, h * 60 + m, a);
        }
      }
      continue;
    }
    const s = airSlot(a);   // air無し or 話数不明 → 曜日で月内反復
    if (!s) continue;
    for (let day = 1; day <= daysInMonth; day++) {
      if (new Date(Date.UTC(calY, calM, day)).getUTCDay() === s.day) add(day, s.time, s.mins, a);
    }
  }
  for (const k in byDay) byDay[k].sort((x, y) => x.mins - y.mins);
  return byDay;
}
function renderCalendar() {
  const el = document.getElementById("cal-overlay");
  const byDay = calItemsByDay();
  const n = new Date();
  const todayDate = (n.getFullYear() === calY && n.getMonth() === calM) ? n.getDate() : -1;
  const dows = ["日", "月", "火", "水", "木", "金", "土"];
  const head = dows.map((d, i) => `<div class="cal-dow ${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${d}</div>`).join("");
  const first = new Date(Date.UTC(calY, calM, 1)).getUTCDay();
  const daysInMonth = new Date(calY, calM + 1, 0).getDate();
  let cells = "", total = 0;
  for (let i = 0; i < first; i++) cells += `<div class="cal-cell blank"></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const items = byDay[day] || [];
    total += items.length;
    const dow = new Date(Date.UTC(calY, calM, day)).getUTCDay();
    const dcls = day === todayDate ? "" : (dow === 0 ? "sun" : dow === 6 ? "sat" : "");
    const rows = items.map(s => `<div class="cal-item" onclick="pinInfo(event, ${s.a.id})" onmouseenter="showInfo(event, ${s.a.id})" onmouseleave="hideInfo()"><span class="t">${s.time}</span><span class="n">${esc(s.a.t)}</span></div>`).join("");
    cells += `<div class="cal-cell ${day === todayDate ? "today" : ""}"><div class="cal-date ${dcls}">${day}</div><div class="cal-items">${rows}</div></div>`;
  }
  const cc = currentCour();
  const body = total
    ? `<div class="cal-grid">${head}${cells}</div>`
    : `<div class="cal-grid">${head}${cells}</div><div class="cal-empty">この月の放送情報がありません。</div>`;
  el.innerHTML = `
    <div class="cal-head">
      <h2>📅 放送カレンダー</h2>
      <span style="color:var(--text-faint);font-size:.82rem;font-weight:600">${cc.year}年 ${SEASON_JA[cc.season]}クール 放送中</span>
      <button class="cal-nav" onclick="calNav(-1)" title="前の月">‹</button>
      <span class="cal-month">${calY}年 ${calM + 1}月</span>
      <button class="cal-nav" onclick="calNav(1)" title="次の月">›</button>
      <button class="cal-btn" onclick="calToday()">今月</button>
      <span class="cal-spacer"></span>
      <button class="cal-btn" onclick="closeCalendar()">✕ 閉じる</button>
    </div>${body}`;
}

// ---- コレクション時パネル: 視聴済の傾向（割合バー / 円グラフ切替）----
const PIE_COLORS = ["#7c5cff", "#34d399", "#fbbf24", "#38bdf8", "#f472b6", "#f87171", "#a48bff", "#4ade80", "#94a3b8"];

// 現在の集計軸(panelStat)の系列を返す。entries=[[label,value]...], total=合計, grouped=上位8+その他にまとめるか。
function statsData() {
  const watched = catalog.filter(a => ["done", "maybe", "watching"].includes(statusOf(a.id)));
  let entries = [], grouped = true, empty = "";
  if (panelStat === "studio") {
    const cnt = {};
    for (const a of watched) for (const st of (a.st ? a.st.split("・") : [])) { const s = st.trim(); if (s) cnt[s] = (cnt[s] || 0) + 1; }
    entries = Object.entries(cnt).sort((x, y) => y[1] - x[1]);
    empty = "製作会社情報がありません。";
  } else if (panelStat === "rating") {
    const cnt = {};
    for (const a of watched) { const r = ratingOf(a.id); if (r > 0) cnt[r] = (cnt[r] || 0) + 1; }
    entries = [5, 4, 3, 2, 1].filter(r => cnt[r]).map(r => ["★".repeat(r), cnt[r]]);
    grouped = false; empty = "評価を付けた作品がまだありません。";
  } else if (panelStat === "decade") {
    const cnt = {};
    for (const a of watched) { const d = Math.floor(a.y / 10) * 10; cnt[d] = (cnt[d] || 0) + 1; }
    entries = Object.keys(cnt).map(Number).sort((a, b) => b - a).map(d => [`${d}年代`, cnt[d]]);
    grouped = false; empty = "データがありません。";
  } else { // source（原作）
    const cnt = {};
    for (const a of watched) { if (a.src) cnt[a.src] = (cnt[a.src] || 0) + 1; }
    entries = Object.entries(cnt).sort((x, y) => y[1] - x[1]);
    empty = "原作情報がありません。";
  }
  const total = entries.reduce((s, e) => s + e[1], 0);
  return { watched, entries, total, grouped, empty };
}
// 円グラフ（r=15.915 → 円周≈100で dasharray が%と一致）＋凡例。初期 0 100 でアニメーション。
function pieHtml(disp, total) {
  let acc = 0;
  const segs = disp.map(([k, v], i) => {
    const pct = total ? v / total * 100 : 0;
    const seg = { k, v, pct: Math.round(pct), color: PIE_COLORS[i % PIE_COLORS.length], dash: `${pct.toFixed(2)} ${(100 - pct).toFixed(2)}`, offset: (25 - acc).toFixed(2) };
    acc += pct;
    return seg;
  });
  const circles = segs.map(s => `<circle class="cp-pie-seg" cx="18" cy="18" r="15.915" fill="none" stroke="${s.color}" stroke-width="4.2" stroke-dasharray="0 100" data-dash="${s.dash}" stroke-dashoffset="${s.offset}"></circle>`).join("");
  const legend = segs.map(s => `<div class="cp-leg" title="${esc(s.k)}: ${s.v}本"><span class="cp-leg-dot" style="background:${s.color}"></span><span class="cp-leg-k">${esc(s.k)}</span><span class="cp-leg-v">${s.pct}%</span></div>`).join("");
  return `<div class="cp-pie-wrap"><div class="cp-pie-box"><svg class="cp-pie" viewBox="0 0 36 36">${circles}</svg></div><div class="cp-legend">${legend}</div></div>`;
}
function statsPanelHtml() {
  const { watched, entries, total, grouped, empty } = statsData();
  const tab = (key, label) => `<button class="cp-tab ${panelStat === key ? "active" : ""}" onclick="setPanelStat('${key}')">${label}</button>`;
  const tabs = `<div class="cp-tabs">${tab("source", "原作")}${tab("decade", "年代")}${tab("studio", "製作会社")}${tab("rating", "評価")}</div>`;
  const head = `<div class="cp-title"><span>📊 視聴の傾向 <span style="color:var(--text-faint);font-weight:600">${watched.length}本</span></span>${tabs}</div>`;
  if (!watched.length) return `${head}<div class="sched-empty">視聴済の作品がまだありません。</div>`;
  if (!entries.length || !total) return `${head}<div class="sched-empty">${empty}</div>`;
  let disp = entries;
  if (grouped && entries.length > 8) {
    const top = entries.slice(0, 8);
    const rest = entries.slice(8).reduce((s, e) => s + e[1], 0);
    disp = rest ? top.concat([["その他", rest]]) : top;
  }
  return `${head}${pieHtml(disp, total)}`;
}
function setPanelStat(s) { panelStat = s; renderContextPanel(); }
// ビューに応じてパネルの中身を切替。年別=放送表 / コレクション=傾向 / 新着・検索中=非表示。
function renderContextPanel() {
  const el = document.getElementById("context-panel");
  if (!el) return;
  if (query) { el.innerHTML = ""; return; }
  if (view.mode === "collection") {
    el.innerHTML = statsPanelHtml();
    requestAnimationFrame(() => {   // 0→目標値へトランジションでアニメーション
      el.querySelectorAll(".cp-pie-seg").forEach(s => { if (s.dataset.dash) s.setAttribute("stroke-dasharray", s.dataset.dash); });
    });
  } else if (view.mode === "year") el.innerHTML = schedulePanelHtml();
  else el.innerHTML = "";
}

/* ---------- アニメ9選 ----------
   視聴済みの中から9作品を選んで3×3グリッドに並べ、タイトル付きJPEG画像として書き出す。
   ・プールのタイルをクリック → 空き枠に追加（選択済みなら解除）
   ・グリッドの枠をクリック → 入れ替え元として選択、別の枠をクリックで位置交換
   ・グリッドの枠を右クリック → その作品を外す（後ろを詰める） */
function toggleBest9(id) {
  const i = best9.indexOf(id);
  if (i >= 0) best9.splice(i, 1);
  else {
    if (best9.length >= 9) { toast("9枠すべて埋まっています。枠を右クリックで外してから追加してください"); return; }
    best9.push(id);
  }
  best9SwapIdx = null;
  saveBest9(); render();
}
function best9SlotClick(i) {
  if (i >= best9.length) return;                 // 空き枠は何もしない
  if (best9SwapIdx === null) best9SwapIdx = i;   // 入れ替え元を選択
  else if (best9SwapIdx === i) best9SwapIdx = null;   // 同じ枠 → 選択解除
  else {
    [best9[best9SwapIdx], best9[i]] = [best9[i], best9[best9SwapIdx]];
    best9SwapIdx = null; saveBest9();
  }
  render();
}
function best9SlotRemove(e, i) {
  e.preventDefault();
  best9.splice(i, 1); best9SwapIdx = null;
  saveBest9(); render();
  return false;
}
// プール用の軽量タイル（posterHtml と違い左クリック=9選への追加/解除。cycle は発火させない）
function best9PickHtml(a) {
  const n = best9.indexOf(a.id);
  const img = a.img
    ? `<img class="img" loading="lazy" src="${esc(a.img)}" alt="" onerror="this.outerHTML='<div class=&quot;noimg&quot;>${esc(a.t)}</div>'">`
    : `<div class="noimg">${esc(a.t)}</div>`;
  const r = ratingOf(a.id);
  return `<article class="poster b9-pick${n >= 0 ? " b9-on" : ""}" onclick="toggleBest9(${a.id})" onmouseenter="showInfo(event,${a.id})" onmouseleave="hideInfo()">
    ${img}
    ${n >= 0 ? `<span class="b9-mark">${n + 1}</span>` : ""}
    <div class="meta"><div class="ttl">${esc(a.t)}</div><div class="sub">${r ? `<span class="myrate">★${r}</span>` : ""}</div></div>
  </article>`;
}
function renderBest9(el) {
  const slots = [];
  for (let i = 0; i < 9; i++) {
    const a = best9[i] != null ? catalog.find(x => x.id === best9[i]) : null;
    if (a) {
      const img = a.img
        ? `<img src="${esc(a.img)}" alt="" loading="lazy">`
        : `<div class="noimg">${esc(a.t)}</div>`;
      slots.push(`<div class="best9-slot filled${best9SwapIdx === i ? " swap-src" : ""}" onclick="best9SlotClick(${i})" oncontextmenu="return best9SlotRemove(event,${i})" title="クリック=入れ替え選択 ／ 右クリック=外す">
        ${img}<div class="b9-ttl">${esc(a.t)}</div></div>`);
    } else {
      slots.push('<div class="best9-slot empty">＋</div>');
    }
  }
  // 選択プール: 視聴済み（done/maybe/watching）を自己評価→海外評価の順で表示。検索で絞り込み可。
  const pool = catalog
    .filter(a => ["done", "maybe", "watching"].includes(statusOf(a.id)))
    .filter(a => !query || searchKey(a).includes(query))
    .sort((x, y) => (ratingOf(y.id) - ratingOf(x.id)) || ((y.sc || 0) - (x.sc || 0)));
  el.innerHTML = `
    <section class="best9">
      <div class="b9-head"><h2>🏆 アニメ9選</h2><span class="b9-cnt">${best9.length} / 9</span></div>
      <p class="b9-note">下の視聴済み一覧から9作品を選んでください。枠クリック=入れ替え元を選択→別の枠クリックで位置交換、右クリックで外せます。</p>
      <div class="best9-grid">${slots.join("")}</div>
      <div class="b9-actions"><button class="ytab collection" onclick="exportBest9()" ${best9.length ? "" : "disabled"}>📸 画像として保存</button></div>
      <div class="b9-head"><h2>視聴済みから選ぶ</h2><span class="b9-cnt">${pool.length}作品${query ? "（検索中）" : ""}</span></div>
      ${pool.length ? `<div class="grid">${pool.map(best9PickHtml).join("")}</div>` : '<p class="b9-note">視聴済みの作品がありません。先に作品を視聴済みにマークしてください。</p>'}
    </section>`;
}
/* 9選のJPEG書き出し。AniList の画像CDNは Access-Control-Allow-Origin を返すため、
   crossOrigin="anonymous" でロードすれば canvas を汚染せずポスターを直接描画できる
   （上の exportImage がテキストのみなのは crossOrigin 未指定時代の制約）。 */
async function exportBest9() {
  const items = best9.map(id => catalog.find(a => a.id === id)).filter(Boolean);
  if (items.length === 0) { alert("作品が選ばれていません。"); return; }
  const date = new Date().toISOString().slice(0, 10);
  toast("画像を生成中…");
  // ポスターを CORS 付きで並行ロード。失敗した枠はグレー地+タイトルで代替描画する。
  const imgs = await Promise.all(items.map(a => new Promise(res => {
    if (!a.img) return res(null);
    const im = new Image();
    im.crossOrigin = "anonymous";
    im.onload = () => res(im);
    im.onerror = () => res(null);
    im.src = a.img;
  })));

  const cell = 240, gap = 14, pad = 40, titleH = 34, headerH = 96;
  const ph = cell * 3 / 2;   // ポスターは 2:3 比
  const W = pad * 2 + cell * 3 + gap * 2;
  const H = headerH + (ph + titleH) * 3 + gap * 2 + pad - titleH + 26;

  const scale = 2;
  const canvas = document.createElement("canvas");
  canvas.width = W * scale; canvas.height = H * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);
  const JP = '"Yu Gothic UI","Meiryo","Hiragino Kaku Gothic ProN",sans-serif';

  ctx.fillStyle = "#0d0e12"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#7c5cff"; ctx.fillRect(0, 0, W, 6);
  ctx.fillStyle = "#e8eaef"; ctx.font = `800 30px ${JP}`;
  ctx.fillText("私のアニメ9選", pad, 56);
  ctx.fillStyle = "#5f6675"; ctx.font = `400 14px ${JP}`;
  ctx.fillText(`${date} 書き出し`, pad, 80);

  for (let i = 0; i < 9; i++) {
    const col = i % 3, row = (i / 3) | 0;
    const x = pad + col * (cell + gap);
    const y = headerH + row * (ph + titleH + gap);
    const a = items[i];
    if (!a) {   // 空き枠は薄い枠線のみ
      ctx.strokeStyle = "#272b36";
      ctx.strokeRect(x + .5, y + .5, cell - 1, ph - 1);
      continue;
    }
    const im = imgs[i];
    if (im) {
      // object-fit: cover 相当の中央クロップ
      const sr = im.width / im.height, dr = cell / ph;
      let sx = 0, sy = 0, sw = im.width, sh = im.height;
      if (sr > dr) { sw = im.height * dr; sx = (im.width - sw) / 2; }
      else { sh = im.width / dr; sy = (im.height - sh) / 2; }
      ctx.drawImage(im, sx, sy, sw, sh, x, y, cell, ph);
    } else {
      ctx.fillStyle = "#15171e"; ctx.fillRect(x, y, cell, ph);
      ctx.fillStyle = "#5f6675"; ctx.font = `400 13px ${JP}`;
      ctx.fillText("NO IMAGE", x + 14, y + ph / 2);
    }
    // タイトル（枠幅に収まるよう末尾を省略、既存 exportImage と同じ手法）
    ctx.fillStyle = "#e8eaef"; ctx.font = `700 14px ${JP}`;
    let t = a.t;
    while (ctx.measureText(t).width > cell && t.length > 2) t = t.slice(0, -1);
    if (t !== a.t) t += "…";
    ctx.textAlign = "center";
    ctx.fillText(t, x + cell / 2, y + ph + 22);
    ctx.textAlign = "left";
  }

  try {
    canvas.toBlob(b => {
      if (!b) { alert("画像の生成に失敗しました。"); return; }
      saveFile(b, `anime-best9-${date}.jpg`, "9選画像を書き出しました");
    }, "image/jpeg", 0.92);
  } catch (e) {
    // 画像が CORS 非対応だった場合 toBlob が SecurityError を投げる保険
    alert("画像の書き出しに失敗しました（ポスター画像のCORS制限の可能性）: " + e.message);
  }
}

/* ---------- main render ---------- */
function render() {
  renderStats();
  renderContextPanel();
  const list = document.getElementById("list");
  const sortBar = (view.mode === "collection" && !query) ? collectionSortBar() : "";   // マイページのクール別/自己評価順トグル

  if (view.mode === "recent" && !query) { renderRecent(list); return; }
  if (view.mode === "timeline" && !query) { renderTimeline(list); return; }
  if (view.mode === "reco" && !query) { renderReco(list); return; }
  if (view.mode === "series" && !query) { renderSeriesWant(list); return; }
  if (view.mode === "compare" && !query) { renderCompare(list); return; }
  // 9選ビューは検索中も維持する（検索は下部の「視聴済みから選ぶ」プールの絞り込みに使う）
  if (view.mode === "best9") { renderBest9(list); return; }
  if (view.mode === "collection" && collectionSort === "rating" && !query) { renderCollectionByRating(list); return; }

  let items;
  let grouped = true; // year+season grouping vs single year

  if (query) {
    items = catalog.filter(a => passStatus(a) && searchKey(a).includes(query));
  } else if (view.mode === "collection") {
    items = catalog.filter(a => statusOf(a.id) !== "unwatched" && passStatus(a));
  } else {
    items = catalog.filter(a => a.y === view.year && passStatus(a));
    grouped = false;
  }

  if (items.length === 0) {
    let msg;
    if (query) {
      msg = "該当する作品がありません。";
    } else if (view.mode === "collection") {
      msg = "まだ視聴済み・視聴中の作品がありません。気になるクールから探してみましょう。";
    } else {
      msg = "この条件の作品がありません。";
    }
    list.innerHTML = sortBar + `<div class="notice"><div class="big">🔍</div><p>${msg}</p></div>`;
    return;
  }

  if (!grouped) {
    const countText = countBreakdown(items);
    list.innerHTML = `<div class="year-block"><div class="year-head"><span>${view.year}年 <span style="color:var(--text-faint);font-size:0.85rem">${countText}</span></span></div><div class="year-block-content">${seasonGroupsHtml(items, view.year)}</div></div>`;
  } else {
    const byYear = {};
    for (const a of items) (byYear[a.y] = byYear[a.y] || []).push(a);
    const ys = Object.keys(byYear).map(Number).sort((x, y) => y - x);
    const isCollection = view.mode === "collection";
    if (isCollection) {
      list.innerHTML = sortBar + nextUpHtml() + decadeGroupsHtml(items);   // 先頭に「次に見る」キュー + 年代→年→クール階層
    } else {
      list.innerHTML = ys.map(y => yearBlockHtml(y, byYear[y], false)).join("");
    }
  }
}

function countBreakdown(arr) {
  const short = arr.filter(a => a.f === "SHORT").length;
  const ova = arr.filter(a => a.f === "OVA").length;
  const movie = arr.filter(a => a.f === "MOVIE").length;
  const parts = [];
  if (short) parts.push(`ショート${short}作品`);
  if (ova) parts.push(`OVA${ova}作品`);
  if (movie) parts.push(`映画${movie}作品`);
  return parts.length ? `${arr.length}作品（内${parts.join("・")}）` : `${arr.length}作品`;
}
function yearBlockHtml(y, yearItems, isCollection, prefix = "") {
  const yKey = prefix ? `${prefix}${y}` : y;
  const yArg = prefix ? `'${yKey}'` : y;
  // 折りたたみトグルが付くのはコレクション系（isCollection=true）のみ。検索結果など
  // isCollection=false の場面では▶トグルが無いため、collapsed を適用すると content が
  // display:none のまま開けなくなる。コレクション系でのみ折りたたみ状態を反映する。
  const collapsed = isCollection && collapsedYears.has(yKey);
  const toggle = isCollection ? `<span class="year-head-toggle" onclick="toggleYear(${yArg}); event.stopPropagation()">${collapsed ? "▶" : "▼"}</span>` : "";
  const headBtn = isCollection ? `onclick="toggleYear(${yArg})"` : "";
  const countText = countBreakdown(yearItems);
  const yearLabel = `${y}年 <span style="color:var(--text-faint);font-size:0.85rem">${countText}</span>`;
  return `<div class="year-block ${collapsed ? "collapsed" : ""}" id="year-${yKey}">
    <div class="year-head" ${headBtn}>${toggle}<span>${yearLabel}</span></div>
    <div class="year-block-content">${seasonGroupsHtml(yearItems, y, prefix)}</div>
  </div>`;
}

// 視聴コレクション「評価順」: 自己評価(1-5)を付けた作品を ★5→★1 の順に並べ、
// 各評価内では放送が古い順（クール別には分けない）。
// 自己評価ページ用: 年代だけで分割し、各年代内は古い順（年→クール階層なし、見出しは控えめ）。
function ratingDecadeHtml(arr, r) {
  const byDec = {};
  for (const a of arr) (byDec[decadeOf(a.y)] = byDec[decadeOf(a.y)] || []).push(a);
  const decs = Object.keys(byDec).map(Number).sort((a, b) => a - b);   // 古い順（昇順）
  return decs.map(d => {
    const items = byDec[d].slice().sort((a, b) => chronoKey(a) - chronoKey(b));   // 各年代内も古い順
    const key = `ratedec-${r}-${d}`;
    const collapsed = collapsedCours.has(key);
    return `<div class="rate-decade ${collapsed ? "collapsed" : ""}" id="cour-${key}">
      <div class="rate-decade-head" onclick="toggleCour('${key}')"><span class="cour-head-toggle">${collapsed ? "▶" : "▼"}</span><span>${d}年代</span><span class="count">${countBreakdown(items)}</span></div>
      <div class="grid">${items.map(a => posterHtml(a)).join("")}</div>
    </div>`;
  }).join("");
}
function renderCollectionByRating(list) {
  const items = catalog.filter(a => ratingOf(a.id) > 0 && passStatus(a));
  if (items.length === 0) {
    list.innerHTML = collectionSortBar() + `<div class="notice"><div class="big">★</div><p>1〜5点の評価を付けた作品がまだありません。ポスターを右クリックして評価を設定できます。</p></div>`;
    return;
  }
  const byRating = {};
  for (const a of items) (byRating[ratingOf(a.id)] = byRating[ratingOf(a.id)] || []).push(a);
  const html = [5, 4, 3, 2, 1].filter(r => byRating[r]).map(r => {
    const arr = byRating[r];
    const countText = countBreakdown(arr);
    const key = `rate-${r}`;
    const collapsed = collapsedCours.has(key);
    // 各評価グループの中を 年代→年→クール で階層表示（折りたたみキーは rateN: で名前空間化）。
    return `<section class="cour ${collapsed ? "collapsed" : ""}" id="cour-${key}">
      <div class="cour-head s-recent" onclick="toggleCour('${key}')">
        <span class="cour-head-toggle">${collapsed ? "▶" : "▼"}</span>
        <span class="season">自己評価 ${"★".repeat(r)}（${r}点）</span>
        <span class="count">${countText}</span>
        <span class="line"></span>
      </div>
      <div class="cour-body">${ratingDecadeHtml(arr, r)}</div>
    </section>`;
  }).join("");
  list.innerHTML = collectionSortBar() + `<div class="year-block">${html}</div>`;
}
// 年代→年→クールの階層HTML（視聴コレクションと新着で共用）。折りたたみ対応。
// prefix: 新着では追加日（例 "2026-06-13:"）を渡し、折りたたみキー兼 id サフィックスを名前空間化する。
// 同一年代/年/クールが複数の追加日に跨っても折りたたみ状態が衝突しないようにするため。
// 視聴コレクション/年別ページは prefix="" で従来どおり（キーは数値のまま）。
function decadeGroupsHtml(items, prefix = "") {
  const byYear = {};
  for (const a of items) (byYear[a.y] = byYear[a.y] || []).push(a);
  const ys = Object.keys(byYear).map(Number).sort((x, y) => y - x);
  const byDecade = {};
  for (const y of ys) (byDecade[decadeOf(y)] = byDecade[decadeOf(y)] || []).push(y);
  const decades = Object.keys(byDecade).map(Number).sort((a, b) => b - a);
  return decades.map(d => {
    const dKey = prefix ? `${prefix}${d}` : d;
    const dArg = prefix ? `'${dKey}'` : d;
    const collapsed = collapsedDecades.has(dKey);
    const decYears = byDecade[d];
    const decItems = decYears.flatMap(y => byYear[y]);
    const countText = countBreakdown(decItems);
    const label = `${d}年代 <span style="color:var(--text-faint);font-size:0.9rem;font-weight:600">${countText}</span>`;
    return `<div class="decade-block ${collapsed ? "collapsed" : ""}" id="decade-${dKey}">
      <div class="decade-head" onclick="toggleDecade(${dArg})">
        <span class="decade-head-toggle">${collapsed ? "▶" : "▼"}</span><span>${label}</span>
      </div>
      <div class="decade-block-content">${decYears.map(y => yearBlockHtml(y, byYear[y], true, prefix)).join("")}</div>
    </div>`;
  }).join("");
}
// 新着は「追加日（更新日）」を最上位グループにし、各追加日の中を 年代→年→クール で階層表示する。
// 新しい追加日が上。折りたたみキーは追加日（`${date}:`）で名前空間化（同一年代/年/クールが複数日に跨るため）。
function recentGroupsHtml(items) {
  const byDate = {};
  for (const a of items) (byDate[a.a] = byDate[a.a] || []).push(a);
  const dates = Object.keys(byDate).sort().reverse();
  return dates.map(d => {
    const arr = byDate[d];
    const countText = countBreakdown(arr);
    return `<div class="recent-date-block">
      <div class="recent-date-head">
        <span class="season">${d} に追加</span>
        <span class="count">${countText}</span>
        <span class="line"></span>
      </div>
      ${decadeGroupsHtml(arr, `${d}:`)}
    </div>`;
  }).join("");
}
function renderRecent(list) {
  const items = catalog.filter(a => a.a && passStatus(a));
  if (items.length === 0) {
    list.innerHTML = `<div class="notice"><div class="big">🆕</div><p>新着作品がありません。</p></div>`;
    return;
  }
  list.innerHTML = recentGroupsHtml(items);   // 追加日（更新日）→年代→年→クールで階層表示
}

/* ---------- 視聴タイムライン（履歴ログ） ----------
   history（新着順 [{id, ep, t}]）を視聴日ごとにグルーピングして表示。今後の視聴のみ自動記録。 */
const TL_WD = ["日", "月", "火", "水", "木", "金", "土"];
function tlPad(n) { return String(n).padStart(2, "0"); }
function tlDayLabel(d) { return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 (${TL_WD[d.getDay()]})`; }
// タイムラインの行クリック: TV系は話数モーダル、劇場は感想モーダルを開く。
function tlOpen(id) {
  const a = catalog.find(x => x.id === id);
  if (!a) return;

  for (const g of groups) {
    html += `<div class="tl-day">${tlDayLabel(g.dt)}</div><div class="tl-list">`;
    for (const { ev, i } of g.evs) {

      const hm = `${tlPad(t.getHours())}:${tlPad(t.getMinutes())}`;
      const title = a ? a.t : `作品 #${ev.id}`;
      const thumb = a && a.img
        ? `<img class="tl-thumb" src="${a.img}" alt="" loading="lazy" onclick="tlOpen(${ev.id})">`
        : `<div class="tl-thumb tl-noimg"></div>`;
      const what = ev.ep > 0 ? `第${ev.ep}話を見た` : "視聴済にした";
      html += `<div class="tl-item">${thumb}`
        + `<div class="tl-body" onclick="tlOpen(${ev.id})"><div class="tl-name">${esc(title)}</div><div class="tl-what">${what}</div></div>`
        + `<div class="tl-time">${hm}</div>`

    }
    html += `</div>`;
  }

}

/* ---------- おすすめ（レコメンド） ----------
   視聴履歴・自己評価から嗜好プロファイルを作り、未視聴作品をスコアリングして提案する。
   完全クライアントサイド（localStorage の watch ＋ カタログのメタデータのみ。ML/バックエンド不要）。 */
const RECO_RATING_W = { 5: 3.0, 4: 2.0, 3: 1.0, 2: 0.5, 1: 0.0 };   // 自己評価★→重み
const RECO_STATUS_W = { done: 1.0, maybe: 1.0, watching: 0.0, dropped: -1.0 };   // 無評価時は状態で代替
const RECO_QUALITY_W = 0.5;   // AniList sc(0-100) の品質プライア係数（同点崩し＋良作浮上）
const RECO_MIN_SEED = 5;      // 履歴がこれ未満ならコールドスタート（高評価作フォールバック）
const RECO_LIMIT = 60;        // 表示件数
let recoShowHidden = false;   // おすすめページで「興味なし一覧」を表示中か
let recoShowSeriesHidden = false;   // おすすめページで「シリーズ興味なし一覧」を表示中か

// 1作品の嗜好重み。評価優先、無ければ状態。0 は寄与なし。
function recoSeedWeight(a) {
  const r = ratingOf(a.id);
  if (r > 0) return RECO_RATING_W[r] || 0;
  return RECO_STATUS_W[statusOf(a.id)] || 0;
}
// 嗜好プロファイル: 各メタ軸ラベル → 平均重み（出現回数で正規化し1本の偏りを抑える）。
function buildTasteProfile() {
  const AX = ["g", "src", "st", "au"];
  const sum = { g: {}, src: {}, st: {}, au: {} };
  const cnt = { g: {}, src: {}, st: {}, au: {} };
  let seeds = 0;
  const add = (ax, label, w) => { if (!label) return; sum[ax][label] = (sum[ax][label] || 0) + w; cnt[ax][label] = (cnt[ax][label] || 0) + 1; };
  for (const a of catalog) {
    if (statusOf(a.id) === "unwatched" || isHidden(a.id) || isSeriesHidden(a)) continue;   // 未視聴／興味なし（作品・シリーズ）は種にしない
    seeds++;
    const w = recoSeedWeight(a);
    if (w === 0) continue;                            // ★1 / 視聴中(無評価) 等は種数に数えるがプロファイルには寄与しない
    for (const g of (a.g || [])) add("g", g, w);
    add("src", a.src, w);
    for (const st of (a.st ? a.st.split("・") : [])) add("st", st.trim(), w);
    add("au", a.au, w);
  }
  const aff = { g: {}, src: {}, st: {}, au: {} };
  for (const ax of AX) for (const k in sum[ax]) aff[ax][k] = sum[ax][k] / cnt[ax][k];
  return { aff, seeds };
}
// 候補作品のスコア = Σ各軸affinity ＋ 品質プライア。
function recoScore(a, aff) {
  let s = 0;
  for (const g of (a.g || [])) s += aff.g[g] || 0;
  s += aff.src[a.src] || 0;
  for (const st of (a.st ? a.st.split("・") : [])) s += aff.st[st.trim()] || 0;
  s += aff.au[a.au] || 0;
  s += (a.sc || 0) / 100 * RECO_QUALITY_W;
  return s;
}
function renderReco(list) {
  const hiddenItems = catalog.filter(a => isHidden(a.id));

  const seriesHiddenItems = catalog.filter(a => isSeriesHidden(a) && formatFilter.has(a.f));
  const seriesHiddenCount = new Set(seriesHiddenItems.map(seriesKey)).size;
  const hideToggle = `<button class="reco-toggle ${recoShowHidden ? "active" : ""}" onclick="toggleRecoHidden()">${recoShowHidden ? "← おすすめに戻る" : `🚫 興味なし ${hiddenItems.length}件`}</button>`;
  const seriesHideToggle = `<button class="reco-toggle ${recoShowSeriesHidden ? "active" : ""}" onclick="toggleRecoSeriesHidden()">${recoShowSeriesHidden ? "← おすすめに戻る" : `🚫 シリーズ興味なし ${seriesHiddenCount}件`}</button>`;

  // 「興味なし一覧」表示モード（おすすめページ内のみ。右クリックで解除できる）。
  if (recoShowHidden) {
    const banner = `<div class="reco-banner"><b>🚫 興味なし（おすすめ非表示）</b> ${hiddenItems.length}件 ${hideToggle}${seriesHiddenItems.length ? " " + seriesHideToggle : ""}<div class="reco-sub">作品を右クリック →「✅ おすすめに表示する」で解除できます。</div></div>`;

  // 「シリーズ興味なし一覧」表示モード。シリーズ単位でまとめて表示し、右クリックで解除できる。
  if (recoShowSeriesHidden) {

    const keys = Object.keys(byKey).sort((k1, k2) => primeBaseTitle(byKey[k1][0].t).localeCompare(primeBaseTitle(byKey[k2][0].t), "ja"));
    const blocks = keys.map(k => {

  }

  const { aff, seeds } = buildTasteProfile();
  // 候補は「未視聴かつ興味なしでない」のみ。状態フィルタは無意味なので形式フィルタのみ尊重。
  // シリーズごと興味なし(hide)は除外。シリーズ「見たい」(want)は視聴決定済みなのでおすすめ候補から外す。
  const candidates = catalog.filter(a => statusOf(a.id) === "unwatched" && !isHidden(a.id) && !isSeriesHidden(a) && !isSeriesWanted(a) && formatFilter.has(a.f));
  const hasProfile = ["g", "src", "st", "au"].some(ax => Object.keys(aff[ax]).length);
  const toggleBit = (hiddenItems.length ? " " + hideToggle : "") + (seriesHiddenItems.length ? " " + seriesHideToggle : "");

  if (seeds < RECO_MIN_SEED || !hasProfile) {   // コールドスタート: AniList高評価の未視聴作
    const top = candidates.filter(a => a.sc).sort((x, y) => (y.sc || 0) - (x.sc || 0)).slice(0, RECO_LIMIT);
    const note = `<div class="reco-banner"><b>おすすめの精度を上げるには</b> 作品を視聴済みにしたり★評価を付けると、好みに合わせた提案になります。今はまず海外で高評価の作品を表示しています。${toggleBit}</div>`;
    list.innerHTML = top.length
      ? note + `<div class="grid">${top.map(a => posterHtml(a)).join("")}</div>`
      : `<div class="notice"><div class="big">✨</div><p>おすすめできる未視聴作品がありません。形式フィルタを確認してください。</p></div>`;
    return;
  }

  const scored = candidates.map(a => [a, recoScore(a, aff)]).filter(e => e[1] > 0).sort((x, y) => y[1] - x[1]).slice(0, RECO_LIMIT);
  if (!scored.length) {
    list.innerHTML = `<div class="reco-banner"><b>✨ おすすめ</b>${toggleBit}</div><div class="notice"><div class="big">✨</div><p>条件に合うおすすめが見つかりませんでした。形式フィルタを広げてみてください。</p></div>`;
    return;
  }
  const topLabels = ax => Object.entries(aff[ax]).filter(e => e[1] > 0).sort((x, y) => y[1] - x[1]).slice(0, 3).map(e => e[0]);
  const sumBits = [["ジャンル", topLabels("g")], ["原作", topLabels("src")], ["制作会社", topLabels("st")]]
    .filter(b => b[1].length)
    .map(b => `<span class="reco-sum-axis"><span class="k">${b[0]}</span>${b[1].map(esc).join(" / ")}</span>`).join("");
  const banner = `<div class="reco-banner"><b>✨ あなたの好みに近い未視聴作品</b>${toggleBit}${sumBits ? `<div class="reco-sum">${sumBits}</div>` : ""}</div>`;
  list.innerHTML = banner + `<div class="grid">${scored.map(([a]) => posterHtml(a)).join("")}</div>`;
}

// 比較ファイル（相手の視聴履歴 JSON）を読み込む。読み込み後は別タブで #compare を開く（不可ならその場表示）。
function importCompare() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json";
  inp.onchange = () => {
    const file = inp.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (typeof parsed !== "object" || Array.isArray(parsed)) throw new Error("形式が不正です（視聴履歴 JSON を選んでください）");
        const w = migrateWatch(parsed);   // 自分の export と同形式を正規化（s/ep/r のみ採用）
        if (!Object.keys(w).length) throw new Error("視聴データが空です");
        let name = (file.name || "").replace(/\.json$/i, "").replace(/^anime-watch-?/, "").trim();
        name = (prompt("比較相手の名前を入力してください（例: 友だち）", name || "相手") || name || "相手").trim() || "相手";
        compare = { name, watch: w, importedAt: new Date().toISOString() };
        saveCompare();
        renderYearbar();
        const win = window.open(location.pathname + "#compare", "_blank");
        if (!win) { goCompare(); }   // ポップアップブロック時はその場で比較ビューへ
        else toast(`${name} さんの視聴データを読み込みました（別タブで比較）`);
      } catch (e) { alert("読み込み失敗: " + e.message); }
    };
    reader.readAsText(file);
  };
  inp.click();
}
function seasonGroupsHtml(items, year, prefix = "") {
  const bySeason = {};
  for (const a of items) (bySeason[a.s] = bySeason[a.s] || []).push(a);

  // 現クール（今放送中のクール）に、別クール開始で継続放送中の非長期作品を複製表示する。
  // 年別ページのみ・検索/コレクション以外・現クールの年を表示しているときだけ対象。
  const cc = currentCour();
  let continuing = [];
  if (view.mode === "year" && !query && year === cc.year) {
    continuing = continuingInCour(cc);
    // 現クールに新規開始作品が無くても、継続作品があればクール枠を作る。
    if (continuing.length && !bySeason[cc.season]) bySeason[cc.season] = [];
  }
  const continuingIds = new Set(continuing.map(a => a.id));

  // 視聴コレクションは現行年も含め全年を逆順（秋→冬）。年別ページのみ現行年は暦順を維持。
  const order = view.mode === "collection" ? SEASON_ORDER_DISPLAY : seasonOrder(year);
  const seasons = Object.keys(bySeason).sort((a, b) => (order[a] ?? 9) - (order[b] ?? 9));
  return seasons.map(s => {
    // OVA/劇場は年別カテゴライズなので評価値順だと分かりづらい → 発売/公開日(d)順に並べる。
    // クール(冬春夏秋)は従来どおり評価値の高い順。日付欠落は末尾、同日は評価値順。
    const hasFullDate = a => a.d && a.d % 100 !== 0 && Math.floor(a.d / 100) % 100 !== 0;
    const base = bySeason[s].slice();
    if (s === "MOVIE") {
      // 公開日(YYYY/MM/DD)が判明している作品を古い順、年のみ(例:2026年)の作品はその後にタイトル昇順。
      base.sort((a, b) => {
        const fa = hasFullDate(a), fb = hasFullDate(b);
        if (fa && fb) return a.d - b.d || (b.sc || 0) - (a.sc || 0);
        if (fa !== fb) return fa ? -1 : 1;
        return (a.t || "").localeCompare(b.t || "", "ja");
      });
    } else if (s === "OVA") {
      base.sort((a, b) => (a.d || Infinity) - (b.d || Infinity) || (b.sc || 0) - (a.sc || 0));
    } else {
      // クール内はショート以外を上、ショートを下にまとめ、各群内は評価値の高い順。
      base.sort((a, b) => ((a.f === "SHORT") - (b.f === "SHORT")) || (b.sc || 0) - (a.sc || 0));
    }
    // 現クールには継続作品を混ぜ、開始作品と合わせてクール全体を（ショートは下に）評価値順で表示する。
    const isCurrentCour = view.mode === "year" && !query && year === cc.year && s === cc.season;
    const cont = isCurrentCour ? continuing.slice() : [];
    const arr = cont.length
      ? base.concat(cont).sort((a, b) => ((a.f === "SHORT") - (b.f === "SHORT")) || (b.sc || 0) - (a.sc || 0))
      : base;
    const shortCount = base.filter(a => a.f === "SHORT").length;
    let countText = shortCount ? `${base.length}作品（内ショート${shortCount}作品）` : `${base.length}作品`;
    if (cont.length) countText += `＋継続${cont.length}作品`;
    const isCour = ["WINTER", "SPRING", "SUMMER", "FALL"].includes(s);
    const label = isCour ? `${year}年 ${SEASON_JA[s] || s}クール` : `${year}年 ${SEASON_JA[s] || s}`;
    const courKey = `${prefix}${year}-${s}`;
    // 現在年ページでは現行クールより前のクールを既定で折りたたむ（ユーザー操作があればそれを優先）。
    if (view.mode === "year" && !query && isCour && !courTouched.has(courKey)
        && year === CURRENT_YEAR && SEASON_ORDER[s] < SEASON_ORDER[cc.season]) {
      collapsedCours.add(courKey);
    }
    // 検索中（query）は結果を常に全展開で見せる。コレクション等で畳んだ状態を引き継がない。
    const courCollapsed = !query && collapsedCours.has(courKey);
    return `<section class="cour ${courCollapsed ? "collapsed" : ""}" id="cour-${courKey}">
      <div class="cour-head ${SEASON_CLS[s] || ""}" onclick="toggleCour('${courKey}')">
        <span class="cour-head-toggle">${courCollapsed ? "▶" : "▼"}</span>
        <span class="season">${label}</span>
        <span class="count">${countText}</span>
        <span class="line"></span>
      </div>
      <div class="grid">${arr.map(a => posterHtml(a, continuingIds.has(a.id) && isCurrentCour)).join("")}</div>
    </section>`;
  }).join("");
}

function statusIcon(st) {
  if (st === "done") return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  if (st === "maybe") return '<span class="qmark">?</span>';
  if (st === "dropped") return '<span class="xmark">×</span>';
  if (st === "planning") return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h12a1 1 0 011 1v19l-7-4.2L5 22V3a1 1 0 011-1z"/></svg>';
  return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
}
function posterHtml(a, continuing) {
  const st = statusOf(a.id);
  const isMovie = a.f === "MOVIE";
  const isOva = a.f === "OVA";
  const cl = (isMovie || isOva) ? null : courLabelFor(a);
  const contBadge = continuing ? '<span class="cont">継続中</span>' : "";
  const epText = isMovie ? "劇場版" : (a.ep ? `全${a.ep}話${a.epEst ? "（暫定）" : ""}` : (a.co ? (a.sp ? "分割" : "連続") + a.co + "クール" : (isOva ? "OVA" : "話数未定")));
  const fmtBadge = a.f === "SHORT" ? '<span class="fmt short">ショート</span>'
                 : isOva ? '<span class="fmt ova">OVA</span>'
                 : isMovie ? '<span class="fmt movie">劇場</span>' : "";
  const ep = epOf(a.id);
  const totalEp = isMovie ? 0 : (a.ep || 0);   // 進捗バッジ用の総話数（劇場版は対象外）
  const prog = st === "watching" ? `<span class="prog">▶${totalEp ? ep + "/" + totalEp : (ep ? ep + "話" : "視聴中")}</span>`
             : st === "dropped" ? `<span class="prog dropped">■${totalEp ? ep + "/" + totalEp + "で" : (ep ? ep + "話で" : "")}中止</span>`
             : (st === "unwatched" && airStatus(a) === "upcoming") ? `<span class="prog upcoming">📅予定</span>` : "";
  const r = ratingOf(a.id);
  const myRate = r ? `<span class="myrate">★${r}</span>` : "";
  const img = a.img
    ? `<img class="img" loading="lazy" src="${esc(a.img)}" alt="" onerror="this.outerHTML='<div class=&quot;noimg&quot;>${esc(a.t)}</div>'">`
    : `<div class="noimg">${esc(a.t)}</div>`;
  // 比較ビューでは自分／相手の視聴状況を対比する行とカテゴリ色（共通/自分のみ/相手のみ）を付与。
  let cmpClass = "", cmpRow = "";
  if (view.mode === "compare" && compare) {
    const cat = cmpCat(a.id);
    cmpClass = " cmp-" + cat;
    const tSt = cmpStatusOf(a.id), tR = cmpRatingOf(a.id);
    const meBit = st !== "unwatched"
      ? `<span class="cmp-me">自分: ${STATUS_JA[st]}${r ? ` ★${r}` : ""}</span>`
      : `<span class="cmp-me none">自分: —</span>`;
    const themBit = tSt !== "unwatched"
      ? `<span class="cmp-them">${esc(compare.name)}: ${STATUS_JA[tSt]}${tR ? ` ★${tR}` : ""}</span>`
      : `<span class="cmp-them none">${esc(compare.name)}: —</span>`;
    cmpRow = `<div class="cmp-row">${meBit}${themBit}</div>`;
  }
  return `<article class="poster ${st}${cmpClass}" onclick="cycle(${a.id})" oncontextmenu="return showCtxMenu(event,${a.id})" onmouseenter="showInfo(event,${a.id})" onmouseleave="hideInfo()">
    ${img}
    ${a.sc ? `<span class="score">★${(a.sc / 10).toFixed(1)}</span>` : `<span class="score noscore">★-.-</span>`}
    <button class="pinfo" type="button" onclick="pinInfo(event,${a.id})" aria-label="作品情報を表示">i</button>
    <span class="status">${statusIcon(st)}</span>
    <div class="meta">
      <div class="ttl">${esc(a.t)}</div>
      <div class="sub">
        ${contBadge}
        <span class="ep">${epText}</span>
        ${cl ? `<span class="multi">${cl.text}</span>` : ""}
        ${fmtBadge}
        ${prog}
        ${myRate}
      </div>
      ${cmpRow}
    </div>
  </article>`;
}

/* ---------- marking ---------- */
function cycle(id) {
  const cur = statusOf(id);
  let next;
  if (cur === "watching" || cur === "dropped") {
    // 話数を入れた視聴中/視聴中止は、誤クリックでも話数を失わないよう両者のトグルだけにする。
    next = cur === "watching" ? "dropped" : "watching";
    setStatus(id, next, epOf(id));
  } else {
    next = LEFT_NEXT[cur] || "done";   // 未マーク/視聴済/多分視聴済/視聴予定 → 3状態巡回
    setStatus(id, next, null);
  }
  renderStats();
  // 視聴コレクション表示中も、未視聴に戻した作品はその場では消さずポスターのみ更新（誤クリック対策）。
  // 次回のページ偏移（年タブ/コレクション/検索など）で再描画され、自然に除外される。
  updatePoster(id);
  toast(STATUS_JA[next] + " にしました");
}
/* ---------- 右クリックメニュー ---------- */
let ctxOpenedAt = 0;
let ctxPos = { x: 0, y: 0 };

    ${isPrimeDirect(a)

      : `<div class="ctx-item" onclick="openPrimeSearch(${id})">🔍 プライム・ビデオで検索</div>`}
    ${(Array.isArray(a.sv) ? a.sv.filter(c => c !== "prime") : []).map(c => `<div class="ctx-item" onclick="openStreamSearch(${id},'${c}')">🔍 ${SV_NAMES[c] || c}で検索</div>`).join("")}
    <div class="ctx-item" onclick="openAniList(${id})">🌐 AniListで開く</div>`;
}
function positionCtx() {
  const m = document.getElementById("ctxmenu");
  const r = m.getBoundingClientRect();
  m.style.left = Math.max(4, Math.min(ctxPos.x, window.innerWidth - r.width - 8)) + "px";

}
function showCtxMenu(e, id) {

}
// 状態・評価を変更してもメニューは開いたまま再描画する。
function rebuildCtx(id) {

function pickStatus(id, status) {

}

function pickSeriesHide(id) {

function pickRating(id, n) {

}
function hideCtxMenu() {

/* ---------- 話数記録モーダル（エピソード単位） ---------- */
let epModalId = null;
let epcSel = 0;   // 話数モーダルで感想入力中の話番号（0=自動選択）
let epAnchor = 0; // 話チップの範囲選択の起点（直近に通常クリックした話番号。0=未設定）
// 話数変更後の共通リフレッシュ: 背後のポスター・統計・キュー・モーダル自身を更新。
function afterEpChange(id) {
  updatePoster(id);
  renderStats();
  if (view.mode === "collection" && !query) refreshNextUp();
  if (view.mode === "timeline" && !query) render();   // 履歴ビューを開いたまま視聴したら反映
  if (epModalId === id) renderEpModal(id);
}
function openEpModal(id) {
  hideCtxMenu();
  const a = catalog.find(x => x.id === id);
  if (!a || a.f === "MOVIE") return;
  // 旧データ（カウントのみ ep=N, eps無し）は [1..N] にシードして話別へ移行。
  const w = watch[id];
  if (w && !Array.isArray(w.eps) && w.ep > 0) markUpTo(id, w.ep, a.ep || 0);
  epcSel = 0;
  epAnchor = 0;
  epModalId = id;
  renderEpModal(id);
  document.getElementById("epoverlay").classList.add("show");
  document.getElementById("epmodal").classList.add("show");
}
function closeEpModal() {
  epModalId = null;
  document.getElementById("epoverlay").classList.remove("show");
  document.getElementById("epmodal").classList.remove("show");
}
// 話チップのクリック。通常はその話のトグル。Shift+クリックでは起点(epAnchor)から
// クリック話までの範囲を「起点の状態」に揃えてまとめて記録/解除する（一気見の範囲指定用）。
function epChipClick(id, n, total, range) {
  if (range && epAnchor > 0 && epAnchor !== n) {
    const lo = Math.min(epAnchor, n), hi = Math.max(epAnchor, n);
    const set = new Set(epsOf(id));
    const mark = set.has(epAnchor);   // 起点が視聴済み→範囲を視聴済みに / 未視聴→範囲を解除
    for (let i = lo; i <= hi; i++) { if (mark) set.add(i); else set.delete(i); }
    commitEps(id, [...set], total);
  } else {
    toggleEp(id, n, total);
  }
  epAnchor = n;
}
function renderEpModal(id) {
  const a = catalog.find(x => x.id === id);
  const m = document.getElementById("epmodal");
  if (!a) { closeEpModal(); return; }
  const total = a.ep || 0;
  const eps = new Set(epsOf(id));
  const watched = eps.size;
  const nx = nextEp(id, total);
  let grid = "";
  if (total > 0) {
    let chips = "";
    for (let n = 1; n <= total; n++) {
      const noted = epNoteOf(id, n) ? " noted" : "";
      const dot = epNoteOf(id, n) ? '<span class="dot">●</span>' : "";
      chips += `<button class="ep-chip ${eps.has(n) ? "on" : ""}${noted}" onclick="epChipClick(${id},${n},${total},event.shiftKey);afterEpChange(${id})" oncontextmenu="epChipClick(${id},${n},${total},true);afterEpChange(${id});return false">${n}${dot}</button>`;
    }
    grid = `<div class="ep-grid">${chips}</div><div class="ep-hint">💡 一気見した話は範囲でまとめて記録: 起点をクリック → 終点を右クリック（Shift+クリックでも可）</div>`;
  }
  const progRight = nx ? `　次: 第${nx}話` : (total && watched >= total ? "　🎉 完走" : "");
  const aLbl = airLabel(a);
  const airBit = aLbl ? ` <span class="air-badge ${airStatus(a)}">${aLbl}</span>` : "";
  const upto = `<div class="ep-upto">ここまで見た:
      <input type="number" min="0" ${total ? `max="${total}"` : ""} inputmode="numeric" value="${watched || ""}" placeholder="—"
             onclick="event.stopPropagation()" onchange="setEp(${id},this.value);afterEpChange(${id})"> 話</div>`;
  const allBtn = total > 0 ? `<button class="ep-btn" onclick="markAllEps(${id},${total});afterEpChange(${id})">全話</button>` : "";
  const plusBtn = total > 0 ? "" : `<button class="ep-btn" onclick="markUpTo(${id},${watched + 1},0);afterEpChange(${id})">＋1 次の話を見た</button>`;
  // 各話の一言感想: 入力対象の話を選ぶ（既定は直近の視聴話、無ければ第1話）。
  const lastEp = epsOf(id).length ? Math.max(...epsOf(id)) : 1;
  const selN = epcSel > 0 ? epcSel : lastEp;
  const epcBlock = `
    <div class="ep-seclabel">各話の感想（💬は感想あり）</div>
    <div class="epc">
      <div class="epc-lbl">第 <input type="number" min="1" ${total ? `max="${total}"` : ""} value="${selN}" style="width:54px"
        onclick="event.stopPropagation()" onchange="epcSel=parseInt(this.value,10)||1;renderEpModal(${id})"> 話のひとこと</div>
      <input type="text" placeholder="この話の感想…" value="${esc(epNoteOf(id, selN))}"
        onclick="event.stopPropagation()" onchange="setEpNote(${id},${selN},this.value);afterEpChange(${id})">
    </div>`;
  m.innerHTML = `
    <div class="ep-head">
      <div class="ep-ttl">${esc(a.t)}</div>
      <button class="ep-close" onclick="closeEpModal()" aria-label="閉じる">×</button>
    </div>
    <div class="ep-prog">視聴済 <b>${watched}</b> / ${total ? "全" + total + "話" : "話数未定"}${progRight}${airBit}</div>
    ${grid}
    ${upto}
    ${epcBlock}
    <div class="ep-actions">${allBtn}${plusBtn}<button class="ep-btn ghost" onclick="openNoteModal(${id})">📝 作品の感想${noteOf(id) ? " ✓" : ""}</button><button class="ep-btn ghost" onclick="clearEps(${id});afterEpChange(${id})">クリア</button></div>`;
}

/* ---------- マイページ「次に見る」キュー ---------- */
// 視聴中かつ総話数が分かり、未視聴話が残る作品を集める（年降順）。
// 次に見る話。総話数が判明していれば未視聴の最小話、放送中で総話数未確定(ep=null)なら
// 「最新視聴話+1」を返す。全話視聴済み（総話数判明時）のときだけ null。
function nextUnwatched(a) {
  if (a.ep > 0) return nextEp(a.id, a.ep);
  const eps = epsOf(a.id);
  return (eps.length ? Math.max(...eps) : 0) + 1;
}
function nextUpItems() {
  return catalog
    .filter(a => statusOf(a.id) === "watching" && nextUnwatched(a) !== null)
    .sort((x, y) => (y.y || 0) - (x.y || 0) || (x.t < y.t ? -1 : 1));
}
function nextUpHtml() {
  const items = nextUpItems();
  if (!items.length) return "";
  const cards = items.map(a => {
    const nx = nextUnwatched(a);
    const as = airStatus(a);
    const badge = (as === "airing" || as === "upcoming") ? `<span class="air-badge ${as}">${airLabel(a)}</span>` : "";
    const action = as === "upcoming"
      ? `<span class="nextup-wait">放送開始待ち</span>`

const WEEKDAY_JA = ["日", "月", "火", "水", "木", "金", "土"];
// d = 公開/発売/放映開始日(YYYYMMDD整数)。月日が 0 のものは粗い粒度で表示。
function fmtDateInt(d) {
  if (!d) return "";
  const y = Math.floor(d / 10000), m = Math.floor(d / 100) % 100, day = d % 100;
  if (!m) return `${y}年`;
  const mm = String(m).padStart(2, "0");
  if (!day) return `${y}/${mm}`;
  return `${y}/${mm}/${String(day).padStart(2, "0")}`;
}
// 情報カードの日付/時刻行。劇場=公開日 / OVA=発売日 / クール(TV・ショート)=放映日と時間。
function airInfoRow(a) {
  const row = (k, v) => `<div class="ic-row"><span class="ic-k">${k}</span>${v}</div>`;
  if (a.s === "MOVIE") return a.d ? row("公開日", fmtDateInt(a.d)) : "";
  if (a.s === "OVA") return a.d ? row("発売日", fmtDateInt(a.d)) : "";
  // クール作品: air(放送1話分のairingAt, unix秒UTC) があれば曜日・時刻まで表示。
  // JST固定表示にするため +9h して getUTC* で取り出す（閲覧者TZ非依存）。実時刻のまま表示。
  if (a.air) {
    const j = new Date(a.air * 1000 + 9 * 3600 * 1000);
    const date = `${j.getUTCFullYear()}/${String(j.getUTCMonth() + 1).padStart(2, "0")}/${String(j.getUTCDate()).padStart(2, "0")}`;
    const time = `${String(j.getUTCHours()).padStart(2, "0")}:${String(j.getUTCMinutes()).padStart(2, "0")}`;
    return row("放映", `${date}（${WEEKDAY_JA[j.getUTCDay()]}）${time}〜`);
  }
  // air 無し（旧作）は MAL の放送枠 bc=[曜日index, "HH:MM"] から毎週の放送枠を表示。
  if (Array.isArray(a.bc) && a.bc.length) {

    return row("放映", `毎週${WEEKDAY_JA[a.bc[0]]}曜${t}`);

}

/* ---------- Wikipedia ---------- */
const WIKI_API = "https://ja.wikipedia.org/w/api.php?format=json&origin=*";
const wikiArticleUrl = t => `https://ja.wikipedia.org/wiki/${encodeURIComponent(t)}`;

// タイトルから日本語Wikipediaの記事URLを解決。
// opensearch は全角/半角・ダッシュ等の表記ゆれを吸収してくれるので、
// 結果から「タイトル (アニメ)」（アニメ専用ページ）→「タイトル」→ 先頭 の優先順で選ぶ。
// 該当記事が無い・通信失敗時は検索結果ページにフォールバック。
// AniListは期ごとに別レコードのため「第2期」等のサフィックス付きが多いが、
// Wikipediaは作品単位の記事が普通。ヒットしなければサフィックスを外して再解決する。
const SEASON_SUFFIX_RE = /\s*(第\s*\d+\s*(期|クール|シーズン|シリーズ)|シーズン\s*\d+|Season\s*\d+|\d+(?:st|nd|rd|th)\s+Season|Part\s*\d+|パート\s*\d+)\s*$/i;
async function resolveWikiUrl(title) {
  const stripped = title.replace(SEASON_SUFFIX_RE, "").trim();
  const queries = stripped && stripped !== title ? [title, stripped] : [title];
  try {
    for (const q of queries) {
      const r = await fetch(`${WIKI_API}&action=opensearch&redirects=resolve&limit=5&search=${encodeURIComponent(q)}`);
      const results = (await r.json())[1] || [];
      if (!results.length) continue;
      const norm = s => s.normalize("NFKC");
      const want = norm(q);
      const hit = results.find(t => norm(t) === `${want} (アニメ)`)
               || results.find(t => norm(t) === want)
               || results[0];
      return wikiArticleUrl(hit);
    }
  } catch (_) { /* オフライン等 → 検索ページへ */ }
  return `https://ja.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(title)}&go=Go`;
}
function openWiki(id) {
  hideCtxMenu();
  const a = catalog.find(x => x.id === id);
  if (!a) return;
  // ポップアップブロック回避: クリック時に同期で空タブを開き、解決後にURLを差し込む
  const w = window.open("about:blank", "_blank");
  if (w) w.opener = null;
  resolveWikiUrl(a.t || a.tr || "").then(url => {
    if (w && !w.closed) w.location.href = url;
    else window.open(url, "_blank", "noopener");
  });
}

// 「葬送のフリーレン 第2期」→「葬送のフリーレン」のように、検索でヒットしやすいベースタイトルにする。
const PRIME_SEASON_SUFFIX_RE = /[\s　]*(第\s*[0-9０-９]+\s*(?:期|部|シーズン|クール)|[0-9]+(?:st|nd|rd|th)\s*season|season\s*[0-9]+|part\s*[0-9]+|[0-9０-９]{1,2}|[ⅠⅡⅢⅣⅤⅥⅦⅰ-ⅶ])\s*$/i;
function primeBaseTitle(t) {
  let s = (t || "").trim(), prev = null;
  while (s !== prev) { prev = s; s = s.replace(PRIME_SEASON_SUFFIX_RE, ""); }
  return s.trim() || (t || "").trim();
}

}

// ファイル保存の共通処理。File System Access API があれば「上書き保存」ダイアログを使い、
// 同じ名前（=同じ日付）のファイルを選べば (1) を付けずに上書きできる。
// 非対応ブラウザ（Firefox/Safari等）は従来のダウンロードにフォールバック。
async function saveFile(blob, filename, toastMsg) {
  if (window.showSaveFilePicker) {
    const ext = filename.slice(filename.lastIndexOf(".") + 1).toLowerCase();
    const accept = ext === "json" ? { "application/json": [".json"] }
                 : ext === "csv"  ? { "text/csv": [".csv"] }
                 : { "image/jpeg": [".jpg", ".jpeg"] };
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: ext.toUpperCase() + " ファイル", accept }],
      });
      const w = await handle.createWritable();
      await w.write(blob);
      await w.close();
      toast(toastMsg);
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return;   // ユーザーがキャンセル
      // それ以外（権限拒否等）は従来方式にフォールバック
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  a.click(); URL.revokeObjectURL(url);
  toast(toastMsg);
}

function exportData(format) {

    const bundle = { v: 2, exportedAt: new Date().toISOString(), watch, history };

// CSV のセルをエスケープ（カンマ・改行・引用符を含む場合のみ "" で囲む）
function csvCell(v) {
  const s = String(v == null ? "" : v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCsv(date) {
  const watched = catalog.filter(a => statusOf(a.id) !== "unwatched");
  if (watched.length === 0) { alert("マークした作品がありません。先に作品を視聴済/視聴中にしてください。"); return; }
  // 書き出しは視聴コレクションと同じく全年を逆順（秋→冬）で並べる。
  watched.sort((a, b) => b.y - a.y
    || (SEASON_ORDER_DISPLAY[a.s] ?? 9) - (SEASON_ORDER_DISPLAY[b.s] ?? 9)
    || (b.sc || 0) - (a.sc || 0));
  const head = ["ID", "タイトル", "原題", "年", "区分", "形式", "視聴状態", "視聴話数", "自分評価", "AniList評価", "感想"];
  const rows = watched.map(a => [
    a.id, a.t, a.tr || "", a.y, SEASON_JA[a.s] || a.s,
    FMT_JA[a.f] || a.f, STATUS_JA[statusOf(a.id)], epOf(a.id) || "", ratingOf(a.id) || "",
    a.sc ? (a.sc / 10).toFixed(1) : "", noteOf(a.id),
  ]);
  const csv = [head, ...rows].map(r => r.map(csvCell).join(",")).join("\r\n");
  // 先頭に BOM を付け、Excel で日本語が文字化けしないようにする
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
  saveFile(blob, `anime-watch-${date}.csv`, "CSVで書き出しました");
}

function importWatch() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json";
  inp.onchange = () => {
    const file = inp.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (typeof parsed !== "object" || Array.isArray(parsed)) throw new Error("形式が不正です");
        // 新形式 { watch, history } と旧形式（素の watch マップ）の両方を受理。
        const rawWatch = parsed.watch && typeof parsed.watch === "object" ? parsed.watch : parsed;
        if (!confirm("現在の視聴データを読み込んだ内容で置き換えます。よろしいですか？")) return;
        watch = migrateWatch(rawWatch); saveWatch();
        if (Array.isArray(parsed.history)) { history = parsed.history.filter(e => e && e.id != null && e.t); saveHistory(); }
        render();
        toast("読み込みました");
      } catch (e) { alert("読み込み失敗: " + e.message); }
    };
    reader.readAsText(file);
  };
  inp.click();
}

/* ---------- export as JPEG image ----------
   AniListのポスター画像は他オリジンのためcanvasを汚染しJPEG化できない。
   そこで視聴済/視聴中タイトルをテキスト描画したまとめ画像を生成する。 */
function exportImage(date) {
  date = date || new Date().toISOString().slice(0, 10);
  const watched = catalog.filter(a => statusOf(a.id) !== "unwatched");
  if (watched.length === 0) { alert("マークした作品がありません。先に作品を視聴済/視聴中にしてください。"); return; }
  watched.sort((a, b) => b.y - a.y || (SEASON_ORDER_DISPLAY[a.s] ?? 9) - (SEASON_ORDER_DISPLAY[b.s] ?? 9) || (b.sc || 0) - (a.sc || 0));

  const byYear = {};
  for (const a of watched) (byYear[a.y] = byYear[a.y] || []).push(a);
  const ys = Object.keys(byYear).map(Number).sort((x, y) => y - x);

  const W = 920, pad = 40, lineH = 30, yearHeadH = 40, yearGap = 14, headerH = 150;
  let bodyH = 0;
  for (const y of ys) bodyH += yearHeadH + byYear[y].length * lineH + yearGap;
  const H = headerH + bodyH + pad;

  const scale = 2;
  const canvas = document.createElement("canvas");
  canvas.width = W * scale; canvas.height = H * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);
  const JP = '"Yu Gothic UI","Meiryo","Hiragino Kaku Gothic ProN",sans-serif';

  ctx.fillStyle = "#0d0e12"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#7c5cff"; ctx.fillRect(0, 0, W, 6);

  ctx.fillStyle = "#e8eaef"; ctx.font = `800 34px ${JP}`;
  ctx.fillText("アニメ視聴コレクション", pad, 64);

  let done = 0, wat = 0;
  for (const id in watch) { const v = (watch[id] || {}).s; if (v === "done") done++; else if (v === "watching") wat++; }
  ctx.font = `700 18px ${JP}`;
  ctx.fillStyle = "#34d399"; ctx.fillText(`✓ 視聴済 ${done}`, pad, 102);
  ctx.fillStyle = "#fbbf24"; ctx.fillText(`▶ 視聴中 ${wat}`, pad + 170, 102);
  ctx.fillStyle = "#5f6675"; ctx.font = `400 14px ${JP}`;
  ctx.fillText(`${date} 書き出し ／ 全${watched.length}作品`, pad, 128);

  let yy = headerH;
  for (const y of ys) {
    ctx.fillStyle = "#a48bff"; ctx.font = `800 22px ${JP}`;
    ctx.fillText(`${y}年`, pad, yy + 22);
    yy += yearHeadH;
    for (const a of byYear[y]) {
      const st = statusOf(a.id);
      ctx.fillStyle = st === "done" ? "#34d399" : st === "maybe" ? "#38bdf8" : st === "dropped" ? "#f87171" : st === "planning" ? "#f472b6" : "#fbbf24";
      ctx.font = `700 15px ${JP}`;
      ctx.fillText(st === "done" ? "✓" : st === "maybe" ? "?" : st === "dropped" ? "×" : st === "planning" ? "▷" : "▶", pad, yy + 16);
      ctx.fillStyle = "#e8eaef"; ctx.font = `400 16px ${JP}`;
      let title = a.t;
      const maxW = W - pad * 2 - 90;
      while (ctx.measureText(title).width > maxW && title.length > 4) title = title.slice(0, -1);
      if (title !== a.t) title += "…";
      ctx.fillText(title, pad + 26, yy + 16);
      ctx.fillStyle = "#5f6675"; ctx.font = `400 13px ${JP}`;
      ctx.textAlign = "right";
      ctx.fillText(`${a.y} ${SEASON_JA[a.s] || a.s}`, W - pad, yy + 16);
      ctx.textAlign = "left";
      yy += lineH;
    }
    yy += yearGap;
  }

  canvas.toBlob(b => {
    if (!b) { alert("画像の生成に失敗しました。"); return; }
    saveFile(b, `anime-collection-${date}.jpg`, "画像を書き出しました");
  }, "image/jpeg", 0.92);
}

init();
</script>
<script src="anime-data.js"></script>
<script>
  // anime-data.js が後から読まれた場合に備えて再初期化
  if (window.ANIME_CATALOG && catalog.length === 0) init();
</script>
<script>
  // Service Worker 登録（PWA / オフライン対応）。file:// では SW 非対応のため http(s) のみ。
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
